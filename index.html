  const gated = fbCfg() && !(FB.on && FB.user && FB.user.inst) && !hasDraft() && !['secure', 'github', 'backup', 'start'].includes(A.sec);
  p.innerHTML = gated ? `<h2>Sign in as the instructor</h2><p class="muted">Secure sign-in is switched on, so private course content only loads after you sign in with Google as ${esc(SITE.instructorEmail)}.</p>
    <button class="btn primary" onclick="fbSignIn()">${G_ICON} Sign in with Google</button>` : adminSection();
  if (!gated && A.sec === 'students' && fbCfg()) fbInit().then(fbAdminLists);
  if (!gated && A.sec === 'github') bindSetPw();
  document.querySelectorAll('.anav button[data-asec]').forEach(b => b.classList.toggle('on', b.dataset.asec === A.sec));
  if (scrollTop) window.scrollTo(0, 0);
}

/* =====================================================================
   ROUTER — #teaching, #course-pe-quizzes, #lec-pe-2, #quiz-pe-q1, #admin
   ===================================================================== */
const SKINS = [['signature', 'Signature', 'Premium: indigo and brass', ['#13203b', '#cfa868', '#f6f5f2', '#9a7536']],
  ['classic', 'Classic', 'Warm paper, copper', ['#f7f5f0', '#b4562a', '#1d3557', '#16202e']],
  ['ocean', 'Ocean', 'Clean white, blue', ['#f5f8fc', '#1f6feb', '#0b2545', '#0f1b2d']],
  ['circuit', 'Circuit', 'Modern, teal', ['#f3f7f6', '#0d9488', '#0f2a3d', '#10201f']],
  ['academic', 'Academic', 'Classic serif, green', ['#f8f6ef', '#2f6b4f', '#22382d', '#1c2420']],
  ['maroon', 'Maroon', 'Institute style', ['#fbf8f6', '#8c1d2f', '#3b0d16', '#22151a']]];
function applySkin() {
  const r = document.documentElement; r.dataset.skin = SITE.theme || 'signature';
  if (SITE.accent) r.style.setProperty('--accent', SITE.accent); else r.style.removeProperty('--accent');
}
/* ---------- site search ---------- */
function searchIndex() {
  const out = [], plain = t => String(t || '').replace(/<[^>]+>/g, ' ').replace(/[#>*$\\{}()_^]/g, ' ').replace(/\s+/g, ' ');
  const open = !locked();
  SITE.courses.forEach(c => {
    out.push({ ty: 'Course', t: c.title, s: c.blurb, h: '#course-' + c.id });
    c.lectures.forEach(l => {
      out.push({ ty: 'Lecture', t: `L${l.n}: ${l.title}`, s: l.summary + (open && l.notes !== 'locked' ? ' ' + plain(l.notes) : ''), h: `#lec-${c.id}-${l.n}`, sub: c.title });
      (l.docs || []).forEach(d => out.push({ ty: 'Document', t: d.title, s: l.title, h: `#lec-${c.id}-${l.n}`, sub: c.title }));
    });
    c.quizzes.forEach(q => out.push({ ty: 'Quiz', t: q.title, s: c.title, h: `#quiz-${c.id}-${q.id}` }));
  });
  (SITE.projects || []).forEach(x => out.push({ ty: 'Project', t: x.title, s: x.summary + ' ' + plain(x.body), h: '#project-' + x.id }));
  visiblePosts().forEach(x => out.push({ ty: 'Blog', t: x.title, s: x.summary + ' ' + x.tags + ' ' + plain(x.body), h: '#post-' + x.id }));
  (SITE.publications || []).forEach(x => out.push({ ty: 'Paper', t: x.title, s: x.authors + ' ' + x.venue, h: '#publications' }));
  (SITE.research || []).forEach(x => out.push({ ty: 'Research', t: x.title, s: x.text, h: '#research' }));
  (SITE.news || []).forEach(x => out.push({ ty: 'News', t: x.text, s: x.date, h: '#home' }));
  return out;
}
function openSearch() {
  openModal(`<label class="sr" for="srQ">Search</label><input type="text" id="srQ" placeholder="Search lectures, notes, projects, blog…" autocomplete="off" style="font-size:1.05rem;padding:12px 14px">
    <div class="sr-res" id="srRes"><p class="faint" style="padding:10px 4px;margin:0">Type at least 2 letters.</p></div>`, true);
  const idx = searchIndex(), q = $('#srQ'); let hl = 0, hits = [];
  const draw = () => {
    const w = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    if (q.value.trim().length < 2) { $('#srRes').innerHTML = '<p class="faint" style="padding:10px 4px;margin:0">Type at least 2 letters.</p>'; hits = []; return; }
    hits = idx.map(x => { const T = x.t.toLowerCase(), S = (x.s || '').toLowerCase(); let sc = 0;
        for (const k of w) { if (T.includes(k)) sc += 3; else if (S.includes(k)) sc += 1; else return null; } return { x, sc }; })
      .filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 20).map(r => r.x);
    hl = 0;
    $('#srRes').innerHTML = hits.length ? hits.map((x, i) => {
      const S = String(x.s || ''), at = S.toLowerCase().indexOf(w[0]), snip = at > 40 ? '…' + S.slice(at - 30, at + 90) : S.slice(0, 110);
      return `<a href="${x.h}" class="${i === 0 ? 'hl' : ''}" onclick="closeModal()"><span class="ty">${x.ty}${x.sub ? ' · ' + esc(x.sub) : ''}</span><br><b>${esc(x.t)}</b><span class="sn">${esc(snip)}</span></a>`; }).join('')
      : '<p class="faint" style="padding:10px 4px;margin:0">No results. Try another word.</p>';
  };
  q.oninput = draw;
  q.onkeydown = e => {
    const as = [...document.querySelectorAll('#srRes a')]; if (!as.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle('hl', i === hl)); as[hl].scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); closeModal(); location.hash = as[hl].getAttribute('href'); }
  };
  q.focus();
}
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); } });

/* ---------- visitor counter (GoatCounter) ---------- */
function countVisit() {
  if (!SITE.goatcounter || location.hash.startsWith('#admin')) return;
  const code = String(SITE.goatcounter).trim().replace(/[^a-z0-9-]/gi, '');
  const go = () => window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path: '/' + (location.hash || '#home'), title: document.title });
  if (!countVisit.loaded) {
    countVisit.loaded = true;
    const sc = document.createElement('script'); sc.async = true; sc.src = 'https://gc.zgo.at/count.js';
    sc.dataset.goatcounter = `https://${code}.goatcounter.com/count`; sc.dataset.goatcounterSettings = '{"no_onload": true}';
    sc.onload = go; document.head.appendChild(sc);
  } else go();
}

/* ---------- installable app ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installLink').style.display = 'inline'; });
function installApp() { if (installEvt) { installEvt.prompt(); installEvt = null; $('#installLink').style.display = 'none'; } }
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$|\.[a-z]+$/.test(location.hostname) && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

function route() {
  applySkin();
  const h = (location.hash || '#home').slice(1), p = h.split('-');
  let html, nav = p[0], after = null;
  A.on = p[0] === 'admin';
  switch (p[0]) {
    case 'about': case 'research': case 'publications': case 'contact':
      html = pageHome(); after = () => { const s = $('#s-' + p[0]); if (s) s.scrollIntoView(); }; break;
    case 'teaching': html = pageTeaching(); break;
    case 'register': html = pageRegister(); nav = 'teaching'; after = bindRegister; break;
    case 'projects': html = pageProjects(); break;
    case 'project': html = pageProject(p.slice(1).join('-')); nav = 'projects'; break;
    case 'blog': html = pageBlog(); break;
    case 'post': html = pagePost(p.slice(1).join('-')); nav = 'blog'; break;
    case 'gallery': { const albums = [...new Set((SITE.gallery || []).map(g => g.album).filter(Boolean))]; html = pageGallery(p[1] !== undefined ? albums[+p[1]] : null); break; }
    case 'live': html = pageLive(); nav = 'teaching'; break;
    case 'library': nav = 'teaching'; html = pageLibrary(); after = () => { if ($('#fq')) { ['fq', 'fc', 'ft'].forEach(id => $('#' + id).addEventListener('input', filterDocs)); filterDocs(); } }; break;
    case 'course': { const c = courseById(p[1]); html = c ? pageCourse(c, p[2] || 'lectures') : notFound(); nav = 'teaching'; break; }
    case 'lec': { const c = courseById(p[1]); html = c ? pageLecture(c, +p[2]) : notFound(); nav = 'teaching'; if (c) after = () => renderQA(c, +p[2]); break; }
    case 'quiz': { const c = courseById(p[1]); html = c ? pageQuiz(c, p[2]) : notFound(); nav = 'teaching'; if (c) after = () => bindQuiz(c, p[2]); break; }
    case 'admin': html = pageAdmin(); after = () => adminIn() ? renderAdmin() : showAdminLogin(false); break;
    default: if (p[0] === '' || p[0] === 'home') { html = pageHome(); nav = 'home'; } else { html = notFound(); nav = ''; }
  }
  app.innerHTML = html;
  if (!['about', 'research', 'publications', 'contact'].includes(p[0])) window.scrollTo(0, 0);
  bindContact();
  if ($('#pubTabs')) { renderPubs('all'); $('#pubTabs').onclick = e => { if (e.target.dataset.f) renderPubs(e.target.dataset.f); }; }
  const v = $('#vid'); if (v) v.onclick = () => { v.outerHTML = `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.dataset.yt)}?autoplay=1&rel=0" title="Lecture video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`; };
  after && after();
  bindScope();
  if (p[0] === 'lec' || p[0] === 'post' || p[0] === 'project') { const nt = $('#notes'); if (nt && $('#toc')) setTimeout(() => buildToc(nt, '#toc'), 50); }
  if (p[0] !== 'lec') document.body.classList.remove('focus');
  renderFooter();
  document.querySelectorAll('nav.main a').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  $('#nav').classList.remove('open');
  $('#updated').textContent = 'Last updated ' + (SITE.updated || '');
  updateDraftBar();
  countVisit();
  if (!A.on) typeset(app);
  fx();
}

/* ---------- motion: scroll reveal, count-up, keyword rotator, tilt, spotlight ---------- */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxObs = null, rotT = null;
function fx() {
  if (A.on) return;
  const sel = 'section.block .eyebrow, section.block h2, section.block .lead, section.block .card, section.block .fact, section.block .timeline li, section.block .news li, .course-card, .lec-row, .session, .page-head, .stat';
  const els = [...app.querySelectorAll(sel)].filter(el => !el.closest('.hero'));
  if (fxObs) fxObs.disconnect();
  if (calm() || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('rv', 'in')); countUp(app, true); }
  else {
    fxObs = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target; el.classList.add('in'); fxObs.unobserve(el);
      setTimeout(() => { el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }, 1300);
      if (e.target.classList.contains('stat')) countUp(e.target);
    }), { rootMargin: '0px 0px -8% 0px', threshold: .08 });
    const sib = new Map();
    els.forEach(el => {
      const k = el.parentElement, i = sib.get(k) || 0; sib.set(k, i + 1);
      el.classList.add('rv'); el.style.setProperty('--d', Math.min(i, 6) * 0.07 + 's'); fxObs.observe(el);
    });
  }
  /* rotating keywords */
  clearTimeout(rotT);
  const w = $('#rotw', app), K = SITE.keywords || [];
  if (w && K.length) {
    if (calm()) w.textContent = K[0];
    else { let i = 0, j = 0, del = false;
      const tick = () => { if (!document.body.contains(w)) return; const word = K[i % K.length];
        j += del ? -1 : 1; w.textContent = word.slice(0, j);
        let t = del ? 28 : 55; if (!del && j === word.length) { del = true; t = 1800; } else if (del && j === 0) { del = false; i++; t = 300; }
        rotT = setTimeout(tick, t); };
      tick(); }
  }
  /* gentle 3D tilt on the hero figure */
  const fig = $('#heroFig', app);
  if (fig && !calm() && matchMedia('(hover: hover)').matches) {
    const hero = fig.closest('.hero');
    hero.onmousemove = e => { const r = fig.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      fig.style.setProperty('--ry', (x * 7).toFixed(2) + 'deg'); fig.style.setProperty('--rx', (-y * 6).toFixed(2) + 'deg'); };
    hero.onmouseleave = () => { fig.style.setProperty('--ry', '0deg'); fig.style.setProperty('--rx', '0deg'); };
  }
}
function countUp(root, now) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count || 0; if (now || calm() || !to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
/* cursor spotlight on cards */
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });
/* reading progress + header shadow */
(() => { const bar = $('#progress'), hd = $('header.top'); let q = false;
  const upd = () => { q = false; const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.transform = `scaleX(${max > 0 ? Math.min(1, h.scrollTop / max) : 0})`; hd.classList.toggle('scrolled', h.scrollTop > 8); };
  addEventListener('scroll', () => { if (!q) { q = true; requestAnimationFrame(upd); } }, { passive: true }); addEventListener('resize', upd); upd(); })();
setInterval(() => document.querySelectorAll('[data-cd]').forEach(el => el.textContent = countdown(el.dataset.cd)), 30000);
if (document.startViewTransition && !calm()) document.documentElement.classList.add('vt');
window.addEventListener('hashchange', () => { if (document.startViewTransition && !calm() && !A.on) { const t = document.startViewTransition(() => route()); [t.ready, t.finished, t.updateCallbackDone].forEach(pr => pr && pr.catch(() => {})); } else route(); });

(async function init() {
  renderUser();
  const d = adminIn() ? store.get('draft', null) : null;
  SITE = normalize(d ? d : await loadPublished());
  route();
  if (fbCfg()) { await fbInit(); renderUser(); route(); }
})();
