<style>
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f0ede6; --ink:#16202e; --ink-2:#4a5566; --ink-3:#7a8494;
  --line:#e2ddd2; --accent:#b4562a; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface)); --navy:#1d3557;
  --ok:#2f7d4f; --ok-soft:#e2f1e7; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b33a3a; --bad-soft:#f8e1e1;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 4px 16px rgba(22,32,46,.06);
  --radius:12px; --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface-2:#1c2531; --ink:#e8e4dc; --ink-2:#aab2bf; --ink-3:#7d8796;
  --line:#2a3443; --accent:#e07a45; --accent-ink:#1a0f08; --accent-soft:color-mix(in srgb,var(--accent) 18%,var(--surface)); --navy:#9fb7d9;
  --ok:#5fc489; --ok-soft:#173326; --warn:#e3a944; --warn-soft:#352914; --bad:#ec7a7a; --bad-soft:#3b1d1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.5vw,3.1rem)} h2{font-size:1.75rem} h3{font-size:1.2rem}
p{margin:0 0 1em}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);font-family:var(--serif);font-weight:600;font-size:1.08rem}
.brand:hover{text-decoration:none}
.mark{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--bg);display:grid;place-items:center;font:600 .9rem var(--mono)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{color:var(--ink-2);padding:7px 11px;border-radius:8px;font-size:.94rem;font-weight:500}
nav.main a:hover{background:var(--surface-2);color:var(--ink);text-decoration:none}
nav.main a.on{color:var(--ink);background:var(--surface-2)}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--ink-3)}
.menu-btn{display:none}
@media (max-width:1080px){
  nav.main{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  .menu-btn{display:grid}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand span:last-child{display:none}#userSlot .btn{padding:6px 12px}}

/* ---------- buttons, chips, cards ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:.95rem}
.btn:hover{text-decoration:none;border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 13px;font-size:.86rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:.8rem;font-weight:500;border:1px solid var(--line)}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
a.card:hover,.rcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 14px 34px color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.lec-row{transition:transform .15s,border-color .15s}.lec-row:hover{transform:translateX(3px)}
.rcard .sym{min-width:52px;width:max-content;padding:0 12px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);font-size:1.1rem!important}
/* ---------- theme presets (chosen in Admin → Look & theme) ---------- */
[data-skin="ocean"]{--accent:#1f6feb;--navy:#0b2545;--bg:#f5f8fc;--surface-2:#edf2f8;--line:#dce4ee;--ink:#0f1b2d;--serif:"IBM Plex Sans",system-ui,sans-serif}
[data-skin="ocean"][data-theme="dark"]{--accent:#58a6ff;--navy:#9cc3ff;--bg:#0d1117;--surface:#151b24;--surface-2:#1b2330;--line:#29323f;--ink:#e6edf3}
[data-skin="circuit"]{--accent:#0d9488;--navy:#0f2a3d;--bg:#f3f7f6;--surface-2:#e9f0ee;--line:#d7e2df;--ink:#10201f;--serif:"Space Grotesk",system-ui,sans-serif}
[data-skin="circuit"][data-theme="dark"]{--accent:#2dd4bf;--navy:#7dd3c8;--bg:#0a1219;--surface:#101b24;--surface-2:#15232e;--line:#22343f;--ink:#e2f1ee}
[data-skin="academic"]{--accent:#2f6b4f;--navy:#22382d;--bg:#f8f6ef;--surface-2:#efede4;--line:#e0dccf;--ink:#1c2420;--serif:"Fraunces",Georgia,serif}
[data-skin="academic"][data-theme="dark"]{--accent:#7cc79d;--navy:#a8d5b8;--bg:#101512;--surface:#171e1a;--surface-2:#1d2621;--line:#2a352f;--ink:#e6ebe4}
[data-skin="maroon"]{--accent:#8c1d2f;--navy:#3b0d16;--bg:#fbf8f6;--surface-2:#f3ece9;--line:#e8ddd8;--ink:#22151a}
[data-skin="maroon"][data-theme="dark"]{--accent:#ef7b8c;--navy:#f0b5bf;--bg:#140d0f;--surface:#1d1417;--surface-2:#251a1e;--line:#36272c;--ink:#efe4e6}

/* ---------- Signature (premium) theme ---------- */
[data-skin="signature"]{--bg:#f6f5f2;--surface:#ffffff;--surface-2:#efede8;--ink:#14213a;--ink-2:#4b5568;--ink-3:#808897;--line:#e3e0d8;
  --accent:#9a7536;--accent-ink:#ffffff;--navy:#14213a;--band:#13203b;--band-ink:#f1ece2;--brass:#cfa868;
  --serif:"Newsreader",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--radius:14px;--shadow:none}
[data-skin="signature"][data-theme="dark"]{--bg:#0e1629;--surface:#141e35;--surface-2:#1a2541;--ink:#ece6da;--ink-2:#b4b3ae;--ink-3:#868b97;--line:#26324f;
  --accent:#d3ad6d;--accent-ink:#13203b;--navy:#d3ad6d;--band:#0a1122;--band-ink:#ece6da}
[data-skin="signature"] body{font-size:16.5px;letter-spacing:-.003em}
[data-skin="signature"] h1,[data-skin="signature"] h2,[data-skin="signature"] h3{font-weight:500;letter-spacing:-.015em}
[data-skin="signature"] h1{font-size:clamp(2.4rem,5.4vw,4.2rem);line-height:1.04}
[data-skin="signature"] h2{font-size:clamp(1.8rem,3vw,2.5rem)}
[data-skin="signature"] .eyebrow{text-transform:none;letter-spacing:0;font:600 .9rem var(--sans);color:var(--accent);margin-bottom:12px}
[data-skin="signature"] .lead{font-size:1.14rem;line-height:1.7}
[data-skin="signature"] .btn{border-radius:9px;padding:11px 20px;font-weight:600}
[data-skin="signature"] .btn.small{padding:7px 14px}
[data-skin="signature"] .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
[data-skin="signature"] .chip{background:transparent;border-color:var(--line);font-weight:500}
[data-skin="signature"] .card{box-shadow:none}
[data-skin="signature"] a.card:hover,[data-skin="signature"] .rcard:hover{transform:none;box-shadow:none;border-color:var(--accent)}
[data-skin="signature"] .lec-row:hover{transform:none;border-color:var(--accent)}
[data-skin="signature"] section.block{padding:96px 0}
[data-skin="signature"] header.top{background:color-mix(in srgb,var(--bg) 82%,transparent)}
[data-skin="signature"] .mark{background:transparent;border:1.5px solid var(--accent);color:var(--accent);font:600 .82rem var(--sans);border-radius:50%}
[data-skin="signature"] .brand{font-weight:500;font-size:1.15rem}
[data-skin="signature"] nav.main a{font-weight:500}
[data-skin="signature"] .fact{border-left:0;border-top:1px solid var(--accent);padding:14px 0 0}
[data-skin="signature"] .fact b{font:600 .85rem var(--sans);text-transform:none;letter-spacing:0;color:var(--ink-3)}
[data-skin="signature"] .rcard .sym{background:transparent;border:1px solid var(--line);border-radius:50%;font-family:var(--serif)!important;font-style:italic;color:var(--accent)}
[data-skin="signature"] .next-live{background:var(--band);color:var(--band-ink);border-radius:var(--radius)}
[data-skin="signature"] .next-live h3{color:var(--band-ink)}
[data-skin="signature"] .next-live .faint{color:color-mix(in srgb,var(--band-ink) 65%,transparent);font-family:var(--sans)!important;font-size:.88rem!important}
[data-skin="signature"] .next-live .btn{background:var(--brass,var(--accent));border-color:transparent;color:#13203b}
[data-skin="signature"] .page-head{padding:64px 0 30px}
[data-skin="signature"] .news .d,[data-skin="signature"] .timeline .mono{font-family:var(--sans);font-size:.9rem}
/* hero band */
[data-skin="signature"] .hero{background:var(--band);color:var(--band-ink);border-bottom:0;padding:92px 0 96px}
[data-skin="signature"] .hero::before{display:none}
[data-skin="signature"] .hero .eyebrow{color:var(--brass)}
[data-skin="signature"] .hero h1{color:var(--band-ink)}
[data-skin="signature"] .hero h1 em{color:inherit}
[data-skin="signature"] .hero .lead{color:color-mix(in srgb,var(--band-ink) 78%,transparent)}
[data-skin="signature"] .hero .lead b{color:var(--band-ink);font-weight:600}
[data-skin="signature"] .hero .btn{background:transparent;color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 30%,transparent)}
[data-skin="signature"] .hero .btn.primary{background:var(--brass);border-color:var(--brass);color:#13203b}
[data-skin="signature"] .hero .chip{color:color-mix(in srgb,var(--band-ink) 72%,transparent);border-color:color-mix(in srgb,var(--band-ink) 18%,transparent)}
[data-skin="signature"] .hero .wrap{grid-template-columns:1fr 1fr}
@media (max-width:880px){[data-skin="signature"] .hero .wrap{grid-template-columns:1fr}}
[data-skin="signature"] .hero .figure{background:transparent;border:0;box-shadow:none;padding:0}
[data-skin="signature"] .hero figcaption{color:color-mix(in srgb,var(--band-ink) 55%,transparent);text-align:left;font-size:.86rem;margin-top:14px}
.scope .trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,.05,.2,1) forwards}
.scope .t2{animation-delay:.3s}.scope .t3{animation-delay:.6s}
.scope .mk{opacity:0;animation:fade .6s ease 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scope .trace{animation:none;stroke-dashoffset:0}.scope .mk{animation:none;opacity:1}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- projects, blog, gallery ---------- */
.proj{padding:0;overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
.proj:hover{text-decoration:none}
.proj .img{aspect-ratio:16/9;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.proj .img svg{width:52%;opacity:.85}
.proj .in{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.proj h3{margin:0}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--ink-3)}
.detail-hero{aspect-ratio:21/9;border-radius:var(--radius);background:var(--surface-2) center/cover no-repeat;margin:6px 0 28px;border:1px solid var(--line)}
.facts-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:0 0 26px}
.facts-list div{border-top:1px solid var(--line);padding-top:10px}
.facts-list b{display:block;font-size:.84rem;color:var(--ink-3);font-weight:600}
.article{max-width:720px}
.article .notes{font-size:1.06rem;line-height:1.75}
.article .notes h3{font-size:1.55rem;margin-top:1.8em}.article .notes h4{font-size:1.2rem}
.post-row{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--line);color:var(--ink)}
.post-row:first-child{border-top:0}
.post-row:hover{text-decoration:none}.post-row:hover h3{color:var(--accent)}
.post-row .img{aspect-ratio:4/3;border-radius:12px;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;border:1px solid var(--line)}
.post-row .img svg{width:70%}
@media (max-width:640px){.post-row{grid-template-columns:1fr}}
.gal{columns:3 250px;column-gap:14px}
.gal button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--surface-2);break-inside:avoid;cursor:zoom-in;position:relative}
.gal img{width:100%;display:block;transition:transform .4s}
.gal button:hover img{transform:scale(1.03)}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;color:#fff;font-size:.86rem;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .2s}
.gal button:hover .cap,.gal button:focus-visible .cap{opacity:1}
.lb{position:fixed;inset:0;background:rgba(6,9,18,.94);display:none;z-index:85;place-items:center;padding:20px}
.lb.open{display:grid}
.lb figure{margin:0;text-align:center}
.lb img{max-width:88vw;max-height:80vh;border-radius:8px;display:block;margin:0 auto}
.lb figcaption{color:#e9e5dc;margin-top:12px;font-size:.95rem}
.lb-x,.lb-nav{position:absolute;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:1.5rem;display:grid;place-items:center}
.lb-x{top:18px;right:18px;font-size:1.1rem}.lb-prev{left:18px;top:50%}.lb-next{right:18px;top:50%}
.lb-x:hover,.lb-nav:hover{background:rgba(255,255,255,.2)}
.thumb{width:72px;height:54px;border-radius:8px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line);flex:none}
.teach-links{display:flex;gap:10px;flex-wrap:wrap;margin:-6px 0 26px}
.avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;display:block;margin-bottom:22px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
[data-skin="signature"] .avatar{border-color:var(--band);box-shadow:0 0 0 1.5px var(--brass)}
.pub .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
pre.cite{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:.82rem/1.5 var(--mono);margin:6px 0 10px;max-height:240px;overflow:auto}
.cform{display:grid;gap:12px;max-width:560px;margin-top:22px}
.cform .two{gap:12px}
.sr-res{max-height:60vh;overflow:auto;margin-top:12px}
.sr-res a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink)}
.sr-res a:hover,.sr-res a.hl{background:var(--surface-2);text-decoration:none}
.sr-res .ty{font-size:.76rem;color:var(--accent);font-weight:600}
.sr-res .sn{font-size:.86rem;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-only{display:none}
@media (max-width:520px){.lg-only{display:none}.sm-only{display:inline}}
@media (max-width:1280px) and (min-width:1081px){nav.main a{padding:7px 8px;font-size:.9rem}.top .wrap{gap:12px}}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:10px 0 18px}
.skin{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left;color:var(--ink)}
.skin.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skin .sw{display:flex;gap:4px;margin-bottom:8px}.skin .sw i{flex:1;height:26px;border-radius:6px}
.skin b{display:block}.skin span{font-size:.8rem;color:var(--ink-3)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
section.block{padding:64px 0;border-bottom:1px solid var(--line)}
.eyebrow{font:500 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.page-head{padding:44px 0 26px}
.crumbs{font-size:.88rem;color:var(--ink-3);margin-bottom:12px}
.crumbs a{color:var(--ink-2)}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- home ---------- */
.hero{padding:76px 0 66px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;
  background:radial-gradient(900px 420px at 85% 10%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 70%),radial-gradient(700px 380px at 0% 100%,color-mix(in srgb,var(--navy) 9%,transparent),transparent 70%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 13%,transparent) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .wrap{position:relative}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:1.12rem;color:var(--ink-2);max-width:40em}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.figure figcaption{font-size:.82rem;color:var(--ink-3);margin-top:8px;text-align:center}
.figure svg{width:100%;height:auto;display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
@media (max-width:640px){.facts{grid-template-columns:1fr}}
.fact{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.fact b{display:block;font-size:.78rem;font-family:var(--mono);color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.rcard .sym{font:600 1.5rem var(--serif);color:var(--accent);margin-bottom:10px}
.tabs-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:.9rem;font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pub{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.pub:first-child{border-top:0}
.pub .t{font-family:var(--serif);font-weight:600;font-size:1.05rem}
@media (max-width:640px){.pub{grid-template-columns:1fr;gap:4px}}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
@media (max-width:640px){.timeline li{grid-template-columns:1fr;gap:2px}}
.news li{list-style:none;display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.news{padding:0;margin:0}
.news li:first-child{border-top:0}
.news .d{font-family:var(--mono);font-size:.85rem;color:var(--ink-3);min-width:80px}
.contact-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ---------- teaching ---------- */
.course-card{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.course-card .band{position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--accent))}
.course-card h3{margin:4px 0 0}
.course-card .meta{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.next-live{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy);color:var(--bg);border-radius:var(--radius);padding:20px 24px;margin-bottom:26px}
.next-live h3{color:var(--bg);margin:2px 0}
.next-live .faint{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.next-live .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
[data-theme="dark"] .next-live{background:var(--surface-2);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
[data-theme="dark"] .next-live h3{color:var(--ink)} [data-theme="dark"] .next-live .faint{color:var(--ink-3)}
[data-theme="dark"] .next-live .btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.announce{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.announce:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}

/* ---------- course ---------- */
.course-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.course-tabs a{padding:11px 14px;color:var(--ink-2);font-weight:500;font-size:.94rem;border-bottom:2px solid transparent;white-space:nowrap}
.course-tabs a:hover{text-decoration:none;color:var(--ink)}
.course-tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.lec-row{display:grid;grid-template-columns:54px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;color:var(--ink)}
.lec-row:hover{text-decoration:none;border-color:var(--ink-3)}
.lec-num{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:600 1rem var(--mono);color:var(--ink-2)}
.lec-row.done .lec-num{background:var(--ok-soft);color:var(--ok)}
.lec-row h4{margin:0 0 2px;font-size:1.05rem}
@media (max-width:640px){.lec-row{grid-template-columns:44px 1fr}.lec-row .right{grid-column:2}}

/* ---------- lecture page ---------- */
.lec-layout{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
@media (max-width:960px){.lec-layout{grid-template-columns:1fr}}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#1d3557,#16202e 60%,#3a1f12);color:#fff;display:grid;place-items:center;border:0;width:100%;padding:0}
.video .play{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);transition:transform .15s}
.video:hover .play{transform:scale(1.07)}
.video .vt{position:absolute;left:20px;bottom:16px;right:20px;text-align:left;font-family:var(--serif);font-size:1.15rem}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.notes{font-size:1.02rem}
.notes h3{margin-top:1.6em}
.notes .box{background:var(--surface-2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:1em 0}
.notes figure{margin:1.2em 0;text-align:center}
.notes figure svg{max-width:440px;width:100%}
.notes figcaption{font-size:.85rem;color:var(--ink-3)}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.side h4{font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 10px;font-weight:600}
.side .card{padding:18px;margin-bottom:16px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink)}
.doc:first-of-type{border-top:0}
.doc:hover{text-decoration:none}
.doc:hover .dt{color:var(--accent)}
.ftype{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font:600 .68rem var(--mono);flex:none;background:var(--surface-2);color:var(--ink-2)}
.ftype.pdf{background:var(--bad-soft);color:var(--bad)} .ftype.slides{background:var(--warn-soft);color:var(--warn)} .ftype.code{background:var(--ok-soft);color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:12px;margin:30px 0 10px}

/* ---------- discussion ---------- */
.post{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.ava{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 .8rem var(--mono);color:var(--ink-2)}
.ava.inst{background:var(--accent);color:var(--accent-ink)}
.post .who{font-weight:600;font-size:.92rem}
.post .when{font-size:.8rem;color:var(--ink-3);margin-left:6px}
.post .body{margin:4px 0 6px;white-space:pre-wrap}
.replies{margin-left:6px;padding-left:16px;border-left:2px solid var(--line)}
.replies .post{border-top:0;padding:10px 0}
textarea,input[type=text],input[type=email],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea:focus,input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.linkish{background:none;border:0;padding:0;color:var(--ink-3);font-size:.84rem}
.linkish:hover{color:var(--accent)}

/* ---------- quiz ---------- */
.q{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:14px}
.q .qn{font:500 .78rem var(--mono);color:var(--ink-3);margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:10px;font-size:.93rem;color:var(--ink-2);display:none}
.checked .why{display:block}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .big{font:600 2.4rem var(--serif)}

/* ---------- live ---------- */
.session{display:grid;grid-template-columns:86px 1fr auto;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px}
.datebox{text-align:center;border-radius:10px;background:var(--surface-2);padding:8px 0}
.datebox b{display:block;font:600 1.6rem var(--serif);line-height:1.1}
.datebox span{font:500 .72rem var(--mono);text-transform:uppercase;color:var(--ink-3)}
.session.now{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.session.past{opacity:.7}
.session .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
@media (max-width:640px){.session{grid-template-columns:70px 1fr}.session .acts{grid-column:1/-1;justify-content:flex-start}}

/* ---------- library ---------- */
.filters{display:grid;grid-template-columns:1fr 200px 160px;gap:10px;margin-bottom:20px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
.doc-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.doc-table th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.doc-table td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.doc-table tr:last-child td{border-bottom:0}
@media (max-width:640px){.doc-table .hide-sm{display:none}}

/* ---------- assignments ---------- */
.asg{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.asg + .asg{margin-top:12px}

/* ---------- lock, modal, toast ---------- */
.lock{max-width:520px;margin:30px auto;text-align:center;padding:40px 30px}
.lock .ic{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;place-items:center;z-index:80;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--surface);border-radius:16px;max-width:440px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal label{display:block;font-size:.88rem;font-weight:500;margin:12px 0 6px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.note{font-size:.84rem;color:var(--ink-3);background:var(--surface-2);padding:10px 12px;border-radius:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.user-pill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.88rem}
.user-pill .ava{width:30px;height:30px;font-size:.72rem}
.notes figure img{max-width:100%;border-radius:8px}
.notes ul{padding-left:1.3em}
/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:220px 1fr;gap:30px;padding:30px 0 140px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:1fr}}
.anav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.anav{position:static;flex-direction:row;flex-wrap:wrap}}
.anav button{text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:.93rem}
.anav button:hover{background:var(--surface-2);color:var(--ink)}
.anav button.on{background:var(--ink);color:var(--bg)}
.anav .sep{height:1px;background:var(--line);margin:8px 0}
.apanel h2{font-size:1.6rem}
.apanel h3{margin-top:26px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.86rem;font-weight:600;margin-bottom:5px}
.help{font-size:.8rem;color:var(--ink-3);margin-top:4px}
.frow{display:flex;gap:8px;align-items:center}
.frow input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media (max-width:640px){.two,.three{grid-template-columns:1fr}}
.arow{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:14px}
@media (max-width:640px){.arow{grid-template-columns:1fr}}
.aa{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.arow .ttl{font-weight:600}
.icon-btn.sm{width:32px;height:32px;font-size:.9rem}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.ck{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0 14px}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
input[type=date],input[type=datetime-local],input[type=number],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input[type=color]{width:60px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 20px}
.cheat{font-size:.84rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:8px 0}
.cheat code{font-family:var(--mono);font-size:.82rem;background:var(--surface);padding:1px 5px;border-radius:4px}
.status-ok{color:var(--ok);font-weight:600} .status-bad{color:var(--bad);font-weight:600}
.steps{padding-left:1.2em} .steps li{margin-bottom:6px}
#draftBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 18px;display:none;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:94vw;flex-wrap:wrap}
#draftBar.show{display:flex}
#draftBar .btn{padding:7px 14px;font-size:.88rem}
#draftBar .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.modal.wide{max-width:640px}
footer{padding:36px 0 50px;color:var(--ink-3);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* =====================================================================
   BOLD REFRESH — motion, glow and glass (all themes; strongest in Signature)
   ===================================================================== */
#progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);z-index:60;background:linear-gradient(90deg,var(--accent),var(--brass,var(--accent)),#8fb0e0);pointer-events:none}
header.top{transition:box-shadow .25s,background .25s}
header.top.scrolled{box-shadow:0 8px 30px rgba(10,16,30,.08)}
[data-theme="dark"] header.top.scrolled{box-shadow:0 8px 30px rgba(0,0,0,.35)}
nav.main a{position:relative}
nav.main a.on::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
/* hero */
.hero{isolation:isolate}
.aurora{position:absolute;inset:-20%;z-index:-1;pointer-events:none;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;max-width:640px;max-height:640px;left:52%;top:8%;background:radial-gradient(circle,rgba(207,168,104,.42),transparent 65%)}
.aurora i:nth-child(2){width:40vw;height:40vw;max-width:560px;max-height:560px;left:8%;top:40%;background:radial-gradient(circle,rgba(91,132,214,.38),transparent 65%);animation-duration:28s;animation-delay:-6s}
.aurora i:nth-child(3){width:30vw;height:30vw;max-width:420px;max-height:420px;left:70%;top:55%;background:radial-gradient(circle,rgba(150,96,200,.28),transparent 65%);animation-duration:34s;animation-delay:-12s}
:root:not([data-skin="signature"]) .aurora{opacity:.35;filter:blur(80px)}
:root:not([data-skin="signature"]) .aurora i{mix-blend-mode:normal}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-6%,8%) scale(1.12)}100%{transform:translate(7%,-5%) scale(.94)}}
.hero-grid{position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(241,236,226,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(241,236,226,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 60% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 60% 40%,#000 20%,transparent 75%)}
:root:not([data-skin="signature"]) .hero-grid{display:none}
.hero h1 em{background:linear-gradient(100deg,var(--accent) 0%,#f3d9a4 30%,var(--accent) 55%,#8fb0e0 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shine 7s linear infinite}
[data-skin="signature"] .hero h1 em{background-image:linear-gradient(100deg,var(--brass) 0%,#fff1cf 28%,var(--brass) 52%,#a9c4ec 100%)}
@keyframes shine{to{background-position:-220% 0}}
.rot{font:500 1.05rem var(--sans);margin:-4px 0 18px;min-height:1.6em;color:var(--ink-2)}
[data-skin="signature"] .hero .rot{color:color-mix(in srgb,var(--band-ink) 70%,transparent)}
.rot b{color:var(--accent);font-weight:600}
[data-skin="signature"] .hero .rot b{color:var(--brass)}
.rot .caret{display:inline-block;width:2px;height:1.05em;vertical-align:-2px;margin-left:2px;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero .btn{transition:transform .18s,box-shadow .2s,background .2s,border-color .2s}
.hero .btn:hover{transform:translateY(-2px)}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.btn.primary:hover::after{transform:translateX(120%)}
[data-skin="signature"] .hero .btn.primary{box-shadow:0 8px 26px rgba(207,168,104,.35)}
[data-skin="signature"] .hero .btn.primary:hover{box-shadow:0 12px 34px rgba(207,168,104,.5)}
[data-skin="signature"] .hero .figure{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(241,236,226,.12);border-radius:18px;padding:18px 18px 14px;backdrop-filter:blur(6px);box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);transform:perspective(1200px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .25s ease-out}
.scope .trace{filter:drop-shadow(0 0 5px currentColor)}
.scope .t1{color:#cfa868}.scope .t2{color:#ece6da}.scope .t3{color:#8fb0e0}
.scope .beam{animation:sweep 4.5s cubic-bezier(.45,.05,.55,.95) 1.8s infinite;opacity:0}
@keyframes sweep{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(400px);opacity:0}}
.scope .mk line[stroke-dasharray]{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.scope .led{animation:led 1.6s ease-in-out infinite}
@keyframes led{50%{opacity:.25}}

      body: String.raw`A dual active bridge has two full bridges, one on each side of a high-frequency transformer. Each bridge produces a square wave. The only thing that separates them is a series inductance \(L\).

# The key idea

$$P = \frac{n\,V_1 V_2}{2\pi f_s L}\;\varphi\left(1 - \frac{|\varphi|}{\pi}\right)$$

/* Notes format: "# Heading", "> highlighted box", "- list item", "$$ maths $$",
   "![caption](files/picture.png)", blank line = new paragraph. Blocks starting with < are raw HTML. */
function mdLite(src) {
  if (!src) return '';
  const out = [];
  for (const blk of String(src).replace(/\r/g, '').split(/\n[ \t]*\n/)) {
    const t = blk.trim(); if (!t) continue;
    if (t[0] === '<') { out.push(t); continue; }
    const lines = t.split('\n'); let mode = null, buf = [];
    const flush = () => {
      if (!buf.length) return;
      if (mode === 'p') out.push(`<p>${inl(buf.join(' '))}</p>`);
      else if (mode === 'ul') out.push('<ul>' + buf.map(x => `<li>${inl(x)}</li>`).join('') + '</ul>');
      else if (mode === 'box') out.push(`<div class="box">${inl(buf.join(' '))}</div>`);
      buf = []; mode = null;
    };
    const add = (m, x) => { if (mode !== m) flush(); mode = m; buf.push(x); };
    for (let i = 0; i < lines.length; i++) {
      const L = lines[i].trim(); let m;
      if (!L) continue;
      if ((m = L.match(/^(#{1,3})\s+(.*)/))) { flush(); const tag = m[1].length === 1 ? 'h3' : 'h4'; out.push(`<${tag}>${inl(m[2])}</${tag}>`); }
      else if (L.startsWith('$$')) { flush(); let math = L; while (!(math.length > 2 && math.endsWith('$$')) && i + 1 < lines.length) math += '\n' + lines[++i]; out.push(`<div class="eq"><div class="math">${esc(math)}</div><button type="button" class="eq-copy" aria-label="Copy equation as LaTeX" title="Copy LaTeX" data-tex="${esc(math.replace(/^\$\$|\$\$$/g, '').trim())}">${ico('copy', 16)}</button></div>`); }
      else if ((m = L.match(/^!\[(.*?)\]\((.*?)\)$/))) { flush(); out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}">${m[1] ? `<figcaption>${esc(m[1])}</figcaption>` : ''}</figure>`); }
      else if (/^[-*] /.test(L)) add('ul', L.slice(2));
      else if (L.startsWith('>')) add('box', L.replace(/^>\s?/, ''));
      else add('p', L);
    }
    flush();
  }
  return out.join('\n');
}

const FB = { on: false, ready: null, user: null, priv: null, justSigned: false };
function fbCfg() {
  const t = String(SITE.firebase || '');
  const g = k => { const m = t.match(new RegExp(k + '["\']?\\s*[:=]\\s*["\']([^"\']+)')); return m ? m[1] : ''; };
  const c = { apiKey: g('apiKey'), authDomain: g('authDomain'), projectId: g('projectId'), appId: g('appId') };
  return c.apiKey && c.projectId ? c : null;
}
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
function fbInit() {
  const cfg = fbCfg(); if (!cfg) return Promise.resolve(false);
  if (FB.ready) return FB.ready;

    if (!window.firebase) { await loadScript(base + 'firebase-app-compat.js'); await loadScript(base + 'firebase-auth-compat.js'); await loadScript(base + 'firebase-firestore-compat.js'); }
    if (!firebase.apps.length) firebase.initializeApp(cfg);

    await new Promise(res => {

        renderUser(); route();

      });
    });

  })().catch(e => { console.warn('Firebase', e); FB.on = false; return false; });

}
async function fbSetUser(u) {
  if (!u) { FB.user = null; FB.priv = null; return; }
  const email = String(u.email || '').toLowerCase(), verified = !!u.emailVerified;
  /* an unverified password account could claim any email, so it gets no access until the email is confirmed */
  const inst = verified && email === String(SITE.instructorEmail).toLowerCase();
  const dom = String(SITE.allowedDomain || '').toLowerCase();
  let approved = verified && (inst || (!!dom && email.endsWith('@' + dom))), pending = false;
  if (verified) try {

  FB.user = { name: u.displayName || email.split('@')[0], email, inst, approved, pending, uid: u.uid, unverified: !verified };
  if (approved) {
    try { const d = await FB.db.doc('private/content').get(); FB.priv = d.exists ? d.data() : null; } catch (e) { FB.priv = null; }
    mergePrivate();
  }
}

/* split into public (GitHub) and private (Firestore, approved students only) */
function splitContent(full) {
  const pub = clone(full), priv = { courses: {} };
  pub.students = [];
  pub.courses.forEach(c => {
    const pc = priv.courses[c.id] = { lectures: {}, quizzes: clone(c.quizzes || []), forms: {}, liveLinks: {} };
    c.lectures.forEach(l => {
      pc.lectures[String(l.n)] = { youtube: l.youtube || '', notes: l.notes || '', docs: l.docs || [] };
      l.youtube = l.youtube ? 'locked' : ''; l.notes = l.notes ? 'locked' : '';
      l.docs = (l.docs || []).map(d => ({ title: d.title, type: d.type, size: d.size || '', url: '' }));
    });
    c.quizzes = (c.quizzes || []).map(q => ({ id: q.id, title: q.title, lecture: q.lecture, questions: q.questions.map(() => ({ q: '', options: [], answer: 0, why: '' })) }));
    (c.assignments || []).forEach(a => { pc.forms[a.id] = a.form || ''; a.form = ''; });
    (c.live || []).forEach(s => { if (s.start) pc.liveLinks[s.start] = s.link || ''; s.link = ''; });
    c.discussion = {};
  });
  return { pub, priv: JSON.parse(JSON.stringify(priv)) };
}
function mergePrivate() {
  if (!FB.priv || hasDraft()) return;
  const P = FB.priv.courses || {};
  SITE.courses.forEach(c => {
    const pc = P[c.id]; if (!pc) return;
    c.lectures.forEach(l => { const x = (pc.lectures || {})[String(l.n)]; if (x) { l.youtube = x.youtube || ''; l.notes = x.notes || ''; l.docs = x.docs || []; } });
    if (pc.quizzes) c.quizzes = pc.quizzes;
    c.assignments.forEach(a => { if (pc.forms && pc.forms[a.id] !== undefined) a.form = pc.forms[a.id]; });
    c.live.forEach(s => { if (pc.liveLinks && pc.liveLinks[s.start] !== undefined) s.link = pc.liveLinks[s.start]; });
  });
}
function fbRules() {
  const adm = String(SITE.instructorEmail || '').toLowerCase().replace(/'/g, '');
  const dom = String(SITE.allowedDomain || '').toLowerCase().replace(/[^a-z0-9.-]/g, '');
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null && request.auth.token.email_verified == true; }
    function myEmail() { return request.auth.token.email.lower(); }
    function isAdmin() { return signedIn() && myEmail() == '${adm}'; }
    function approved() { return signedIn() && (exists(/databases/$(database)/documents/roster/$(myEmail()))${dom ? ` || myEmail().matches('.*@${dom.replace(/\./g, '[.]')}')` : ''}); }
    match /roster/{email} {
      allow read: if isAdmin() || (signedIn() && email == myEmail());
      allow write: if isAdmin();
    }
    match /registrations/{email} {
      allow read: if isAdmin() || (signedIn() && email == myEmail());
      allow create, update: if signedIn() && email == myEmail();
      allow delete: if isAdmin();
    }
    match /private/{doc} {
      allow read: if approved() || isAdmin();
      allow write: if isAdmin();
    }
    match /qa/{thread}/posts/{post} {
      allow read: if approved() || isAdmin();
      allow create: if (approved() || isAdmin()) && request.resource.data.uid == request.auth.uid
                    && (request.resource.data.inst == false || isAdmin());
      allow delete: if isAdmin();
    }
  }
}`;
}

function bindScope() {
  const box = $('#lscope'); if (!box) return;
  const inp = $('#lsPhi'), X0 = 50, X1 = 450, P = 200, N = 400;
  const lvl = (x, sh) => ((((x - sh) % P) + P) % P) < P / 2 ? 1 : -1;
  const sq = (y, A, sh) => { let d = `M${X0} ${y - A * lvl(X0 + .01, sh)}`;
    for (let k = Math.ceil((X0 - sh) / (P / 2)); ; k++) { const e = sh + k * P / 2; if (e >= X1) break; if (e > X0) d += ` H${e.toFixed(1)} V${(y - A * lvl(e + .01, sh)).toFixed(1)}`; }
    return d + ` H${X1}`; };
  const cur = sh => { const v = []; let acc = 0; for (let k = 0; k <= N; k++) { const x = X0 + (X1 - X0) * k / N; acc += (lvl(x, X0) - lvl(x, X0 + sh)); v.push(acc); }
    const m = (Math.max(...v) + Math.min(...v)) / 2; return v.map(a => a - m); };
  const ref = Math.max(...cur(P / 4).map(Math.abs));
  let shown = null;
  const draw = deg => {
    deg = Math.round(deg * 2) / 2; if (deg === shown) return; shown = deg;
    const sh = deg / 360 * P, ph = Math.abs(deg) * Math.PI / 180, ratio = ph * (1 - ph / Math.PI) / (Math.PI / 4);
    $('#lsV1').setAttribute('d', sq(62, 26, X0)); $('#lsV2').setAttribute('d', sq(146, 26, X0 + sh));
    const iv = cur(sh); $('#lsI').setAttribute('d', iv.map((a, k) => (k ? 'L' : 'M') + (X0 + (X1 - X0) * k / N).toFixed(1) + ' ' + (228 - 40 * a / ref).toFixed(1)).join(''));
    const gx = X0 + P, tx = gx + sh;
    $('#lsGuide').setAttribute('x1', gx); $('#lsGuide').setAttribute('x2', gx);
    $('#lsArr').setAttribute('x1', gx); $('#lsArr').setAttribute('x2', tx);
    $('#lsHead').setAttribute('d', Math.abs(sh) < 3 ? '' : `M${tx} 104 l${sh > 0 ? -6 : 6} -4 v8z`);
    $('#lsPhiT').setAttribute('x', Math.min(gx, tx) + Math.abs(sh) / 2 - 5);
    $('#lsPhiVal').textContent = `${deg > 0 ? '+' : ''}${Math.round(deg)}°`;
    $('#lsBar').style.width = (ratio * 100).toFixed(1) + '%';
    $('#lsP').textContent = deg === 0 ? 'No power flows' : `Power ${Math.round(ratio * 100)}% of maximum · Port ${deg > 0 ? '1 → 2' : '2 → 1'}`;

}

function citeData(p) {
  const authors = String(p.authors || '').replace(/\s+et al\.?/i, ', others').split(/\s*,\s*(?:and\s+)?|\s+and\s+/).map(a => a.trim()).filter(Boolean);
  const first = (authors[0] || 'author').split(/\s+/).pop().replace(/[^A-Za-z]/g, '').toLowerCase();
  const word = (String(p.title).match(/[A-Za-z]{4,}/) || ['paper'])[0].toLowerCase();
  const key = first + (p.year || '') + word, conf = p.type === 'conference';
  const ieeeAuth = authors.map(a => a === 'others' ? 'et al.' : a).join(', ').replace(/, et al\./, ' et al.');
  const ieee = `${ieeeAuth}, "${p.title}," ${conf ? 'in Proc. ' : ''}${p.venue}${p.year && !String(p.venue).includes(p.year) ? ', ' + p.year : ''}${p.doi ? ', doi: ' + p.doi : ''}.`;
  const bib = `@${conf ? 'inproceedings' : 'article'}{${key},\n  author = {${authors.join(' and ')}},\n  title = {${p.title}},\n  ${conf ? 'booktitle' : 'journal'} = {${p.venue}},\n  year = {${p.year}}${p.doi ? `,\n  doi = {${p.doi}}` : ''}\n}`;
  return { ieee, bib };
}

function scopeSvg() {
  const P = 200, A = 24, X0 = 50, X1 = 450;
  const lvl = (x, sh) => ((((x - sh) % P) + P) % P) < P / 2 ? -A : A;
  const sq = (y, sh) => { let d = `M${X0} ${y + lvl(X0 + .01, sh)}`;
    for (let k = Math.ceil((X0 - sh) / (P / 2)); ; k++) { const e = sh + k * P / 2; if (e >= X1) break; if (e > X0) d += ` H${e} V${y + lvl(e + .01, sh)}`; }
    return d + ` H${X1}`; };
  const grid = [...Array(9)].map((_, i) => `<line x1="${X0 + i * 50}" y1="22" x2="${X0 + i * 50}" y2="268"/>`).join('') + [70, 145, 220].map(y => `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}"/>`).join('');
  return `<svg class="scope" viewBox="0 0 470 290" role="img" aria-label="Three phase-shifted square-wave bridge voltages v1, v2 and v3">
    <rect x="${X0}" y="22" width="${X1 - X0}" height="246" rx="6" fill="none" stroke="rgba(241,236,226,.14)"/>
    <g stroke="rgba(241,236,226,.07)" stroke-width="1">${grid}</g>
    <defs><linearGradient id="beamG" x1="0" x2="1"><stop offset="0" stop-color="#cfa868" stop-opacity="0"/><stop offset=".85" stop-color="#cfa868" stop-opacity=".22"/><stop offset="1" stop-color="#fff1cf" stop-opacity=".7"/></linearGradient></defs>
    <rect class="beam" x="${X0 - 40}" y="23" width="40" height="244" fill="url(#beamG)"/>
    <g fill="none" stroke-width="2.2" stroke-linejoin="miter">
      <path class="trace t1" pathLength="1" d="${sq(70, 0)}" stroke="#cfa868"/>
      <path class="trace t2" pathLength="1" d="${sq(145, 40)}" stroke="#ece6da"/>
      <path class="trace t3" pathLength="1" d="${sq(220, 70)}" stroke="#8fb0e0"/>
    </g>
    <g font-family="Newsreader, Georgia, serif" font-style="italic" font-size="17" fill="rgba(241,236,226,.85)">
      <text x="14" y="76">v₁</text><text x="14" y="151">v₂</text><text x="14" y="226">v₃</text></g>
    <g font-family="IBM Plex Mono, monospace" font-size="10" fill="rgba(241,236,226,.5)"><circle class="led" cx="${X1 - 64}" cy="12" r="3.2" fill="#5fc489"/><text x="${X1 - 56}" y="15.5">RUN · 100 kHz</text></g>
    <g class="mk" stroke="#cfa868" stroke-width="1" fill="#cfa868" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="17">
      <line x1="200" y1="40" x2="200" y2="250" stroke-dasharray="3 4" opacity=".6"/>
      <line x1="200" y1="108" x2="234" y2="108"/><path d="M234 104 L240 108 L234 112Z" stroke="none"/><text x="204" y="100" stroke="none">φ₁₂</text>
      <line x1="200" y1="183" x2="264" y2="183"/><path d="M264 179 L270 183 L264 187Z" stroke="none"/><text x="212" y="175" stroke="none">φ₁₃</text>
    </g></svg>`;
}

function openLb(i) { LB.i = i; showLb(); $('#lb').classList.add('open'); }
function showLb() { const g = LB.list[LB.i]; if (!g) return; $('#lbImg').src = g.image; $('#lbImg').alt = g.caption || ''; $('#lbCap').textContent = [g.caption, g.album].filter(Boolean).join(' — '); }
function stepLb(d) { LB.i = (LB.i + d + LB.list.length) % LB.list.length; showLb(); }
function closeLb() { $('#lb').classList.remove('open'); }
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb(); });
document.addEventListener('keydown', e => { if (!$('#lb').classList.contains('open')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') stepLb(1); if (e.key === 'ArrowLeft') stepLb(-1); });

const CTABS = [['lectures', 'Lectures'], ['live', 'Live classes'], ['documents', 'Documents'], ['quizzes', 'Quizzes'], ['assignments', 'Assignments'], ['discussion', 'Q&A']];

function liveList(list) {
  if (!list.length) return '<div class="empty">No live classes scheduled.</div>';
  const up = list.filter(s => liveState(s) !== 'past'), past = list.filter(s => liveState(s) === 'past').reverse();
  const row = s => {
    const st = liveState(s), d = new Date(s.start);
    const acts = st === 'past'
      ? (s.lecture ? `<a class="btn small" href="#lec-${s.course.id}-${esc(s.lecture)}">Watch recording</a>` : '<span class="chip">Ended</span>')
      : `<a class="btn small" href="${gcalLink(s)}" target="_blank" rel="noopener">Add to calendar</a>
         <button class="btn small ${st === 'now' ? 'primary' : ''}" onclick="joinLive('${s.course.id}','${esc(s.start)}')">${st === 'now' ? 'Join now' : 'Join link'}</button>`;
    return `<div class="session ${st}"><div class="datebox"><span>${d.toLocaleDateString('en-IN', { month: 'short' })}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-IN', { weekday: 'short' })}</span></div>
      <div><div class="faint" style="font-size:.82rem">${esc(s.course.title)}</div><h4 style="margin:2px 0 4px;font-size:1.08rem">${esc(s.title)}</h4>
      <div class="muted" style="font-size:.9rem">${st === 'now' ? '<span class="pulse"></span><b style="color:var(--ok)">Live now</b> · ' : ''}${fmtTime(s.start)} · ${esc(s.mins)} min${st === 'upcoming' ? ` · <span data-cd="${esc(s.start)}">${countdown(s.start)}</span>` : ''}</div></div>
      <div class="acts">${acts}</div></div>`;
  };
  return (up.length ? `<h3>Upcoming</h3>${up.map(row).join('')}` : '') + (past.length ? `<h3 style="margin-top:28px">Past sessions</h3>${past.map(row).join('')}` : '');
}

}

/* ---------- lecture page ---------- */
function posts(c, n) { return store.get(`qa_${c.id}_${n}`, null) || clone((c.discussion || {})[n] || []); }
function countPosts(p) { return p.reduce((s, x) => s + 1 + (x.replies || []).length, 0); }
function pageLecture(c, n) {
  const i = c.lectures.findIndex(l => +l.n === n), l = c.lectures[i];
  if (!l) return notFound();
  const head = `<div class="crumbs"><a href="#teaching">Teaching</a> / <a href="#course-${c.id}">${esc(c.title)}</a> / Lecture ${esc(l.n)}</div>`;
  if (locked()) return `<div class="wrap"><div class="page-head">${head}<h1 style="font-size:2rem">${esc(l.title)}</h1></div>${lockCard('Lectures')}</div>`;
  const isDone = done(c.id).includes(l.n), prev = c.lectures[i - 1], nxt = c.lectures[i + 1];

  return `<div class="wrap"><div class="page-head" style="padding-bottom:20px">${head}
    <div class="eyebrow">Lecture ${esc(l.n)}${l.date ? ' · ' + fmtDate(l.date) : ''}</div><h1 style="font-size:2.1rem">${esc(l.title)}</h1></div>

      ${l.youtube ? `<button class="video" id="vid" data-yt="${esc(l.youtube)}" aria-label="Play video"><span class="play"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span><span class="vt">${esc(l.title)}${l.mins ? ' · ' + esc(l.mins) + ' min' : ''}</span></button>`

      </div>
      <button class="btn small focus-exit" onclick="toggleFocus()">Exit focus mode</button>
      <div class="card notes" id="notes"><h2 style="font-size:1.4rem">Lecture notes</h2>${l.summary ? `<p class="muted">${esc(l.summary)}</p>` : ''}${l.notes ? mdLite(l.notes) : '<div class="empty">Notes coming soon.</div>'}</div>
      <div class="pager">${prev ? `<a class="btn" href="#lec-${c.id}-${prev.n}">← L${esc(prev.n)}: ${esc(prev.title)}</a>` : '<span></span>'}${nxt ? `<a class="btn" href="#lec-${c.id}-${nxt.n}">L${esc(nxt.n)}: ${esc(nxt.title)} →</a>` : ''}</div>
      <div class="card" style="margin:20px 0 60px" id="qa"></div>
    </div>
    <aside class="side">
      <div class="card"><h4>Documents</h4>${l.docs.length ? l.docs.map(d => `<a class="doc" ${docLink(d)}><span class="ftype ${esc(d.type)}">${TYPE_LABEL[d.type] || 'FILE'}</span><span><span class="dt">${esc(d.title)}</span><br><span class="faint mono" style="font-size:.76rem">${esc(d.size || '')}</span></span></a>`).join('') : '<p class="faint" style="margin:0">No files for this lecture.</p>'}</div>
      <div class="card"><h4>In this course</h4>${c.lectures.map(x => `<a class="doc" href="#lec-${c.id}-${x.n}" style="${x.n === l.n ? 'font-weight:600' : ''}"><span class="ftype" style="${done(c.id).includes(x.n) ? 'background:var(--ok-soft);color:var(--ok)' : ''}">${done(c.id).includes(x.n) ? '✓' : 'L' + esc(x.n)}</span><span class="dt">${esc(x.title)}</span></a>`).join('')}</div>
      <div class="card toc" id="toc" hidden><h4>On this page</h4><nav></nav></div>
    </aside></div></div>`;
}
function renderQA(c, n) {
  if (fbCfg()) { if (FB.on && FB.user) renderQAfb(c, n); return; }
  const el = $('#qa'); if (!el) return;
  const u = user(), p = posts(c, n);
  const post = (x, pi, ri) => `<div class="post"><span class="ava ${x.inst ? 'inst' : ''}">${esc(initials(x.who))}</span><div>
    <span class="who">${esc(x.who)}</span>${x.inst ? ' <span class="chip accent" style="font-size:.7rem;padding:1px 7px">Instructor</span>' : ''}<span class="when">${fmtDate(x.t, { day: 'numeric', month: 'short' })}, ${fmtTime(x.t)}</span>
    <div class="body">${esc(x.text)}</div>${ri === undefined ? `<button class="linkish" onclick="replyBox(${pi})">Reply</button><div id="rb${pi}"></div>` : ''}</div></div>`;
  el.innerHTML = `<h3>Questions &amp; discussion <span class="chip" style="vertical-align:middle">${countPosts(p)}</span></h3>
    ${p.length ? p.map((x, pi) => post(x, pi) + ((x.replies || []).length ? `<div class="replies">${x.replies.map((r, ri) => post(r, pi, ri)).join('')}</div>` : '')).join('') : '<p class="faint">No questions yet. Be the first to ask.</p>'}
    ${!u ? `<p style="margin-top:16px"><button class="btn small primary" onclick="showSignIn()">Sign in to ask a question</button></p>` : `<form id="askForm" style="margin-top:16px"><textarea id="askTxt" placeholder="Ask a question about this lecture…" required></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap"><span class="faint" style="font-size:.8rem">Preview: posts are saved in this browser only. Shared discussion comes with secure sign-in.</span><button class="btn small primary">Post question</button></div></form>`}`;
  if (!u) { window.replyBox = () => showSignIn(); return; }
  $('#askForm').onsubmit = e => {
    e.preventDefault(); const t = $('#askTxt').value.trim(); if (!t) return;
    p.push({ who: u.name, inst: u.inst, t: new Date().toISOString(), text: t, replies: [] });
    store.set(`qa_${c.id}_${n}`, p); renderQA(c, n); toast('Question posted');
  };
  window.replyBox = pi => {
    $('#rb' + pi).innerHTML = `<form style="margin-top:8px"><textarea placeholder="Write a reply…" required style="min-height:60px"></textarea><div style="text-align:right;margin-top:6px"><button class="btn small">Reply</button></div></form>`;
    const f = $('#rb' + pi + ' form'); f.querySelector('textarea').focus();
    f.onsubmit = e => { e.preventDefault(); const t = f.querySelector('textarea').value.trim(); if (!t) return;
      (p[pi].replies = p[pi].replies || []).push({ who: u.name, inst: u.inst, t: new Date().toISOString(), text: t });
      store.set(`qa_${c.id}_${n}`, p); renderQA(c, n); };
  };
}

/* ---------- quiz ---------- */
function pageQuiz(c, qid) {

  return `<div class="wrap" style="max-width:780px"><div class="page-head" style="padding-bottom:20px">${head}<h1 style="font-size:2rem">${esc(q.title)}</h1>
    <p class="muted">${q.questions.length} questions · instant feedback with explanations · your best score is saved${q.lecture ? ` · <a href="#lec-${c.id}-${esc(q.lecture)}">review lecture ${esc(q.lecture)}</a>` : ''}</p></div>
    <form id="quizForm">${q.questions.map((x, i) => `<div class="q" id="qq${i}"><div class="qn">QUESTION ${i + 1} OF ${q.questions.length}</div><div style="font-weight:500">${inl(x.q)}</div>

      <div id="quizRes" style="margin:20px 0"></div>
      <div style="display:flex;gap:10px;margin-bottom:60px"><button class="btn primary" id="qSubmit">Check answers</button><button type="button" class="btn" onclick="route()">Reset</button></div></form></div>`;

/* =====================================================================
   GITHUB — saves content.json and uploaded files into your repository
   ===================================================================== */
const GH = {
  cfg() { return Object.assign({ owner: 'ajitpatra861-creator', repo: 'ajitpatra861-creator.github.io', token: '', branch: '', ok: false }, store.get('gh', {})); },
  save(c) { store.set('gh', c); },
  async api(path, opts = {}) {
    const c = this.cfg();
    let r;
    try {
      r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {
        ...opts, cache: 'no-store',
        headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
      });
    } catch (e) { throw new Error('Could not reach GitHub. Check your internet, or open the Admin page on your live website (this preview cannot connect).'); }
    if (r.status === 401) throw new Error('GitHub did not accept the key. It may be mistyped or expired — create a new one.');
    if (r.status === 403) throw new Error('The key does not have permission. Give it "Contents: Read and write" for this repository.');
    return r;
  },
  async connect() {
    const r = await this.api('');
    if (r.status === 404) throw new Error('Repository not found. Check the user name and repository name, and that the key includes this repository.');
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw new Error('The key can read but not write. Set "Contents" to "Read and write".');
    const c = this.cfg(); c.branch = j.default_branch || 'main'; c.ok = true; this.save(c);
  },
  pathUrl(p) { return '/contents/' + p.split('/').map(encodeURIComponent).join('/'); },
  async get(p) {
    const r = await this.api(this.pathUrl(p) + '?ref=' + encodeURIComponent(this.cfg().branch));
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    return r.json();
  },
  async put(p, b64, msg) {
    const old = await this.get(p);
    const r = await this.api(this.pathUrl(p), { method: 'PUT', body: JSON.stringify({ message: msg, content: b64, branch: this.cfg().branch, ...(old ? { sha: old.sha } : {}) }) });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error('Saving failed (' + r.status + ') ' + m); }
    return r.json();
  }
};
function b64utf8(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64utf8(b) { const bin = atob(b.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); }
const fileB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

async function shrinkImage(file) {
  try {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    if (file.type === 'image/png' && file.size < 1.5e6) return file;
    const bmp = await createImageBitmap(file), max = 2000, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 1.2e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
    return blob ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}
async function uploadFile(file) {
  if (!GH.cfg().ok) { needGitHub('upload files'); return null; }
  if (file.size > 25 * 1048576) { toast('That file is over 25 MB. Put it on Google Drive and paste the share link instead.', 5000); return null; }
  file = await shrinkImage(file);
  const m = file.name.match(/^(.*?)(\.[^.]+)?$/), name = m[1].replace(/[^\w\-]+/g, '_').slice(0, 60) + '-' + Date.now().toString(36) + (m[2] || ''), path = 'files/' + name;
  toast('Uploading ' + name + '…', 60000);
  try { await GH.put(path, await fileB64(file), 'Upload ' + name); toast('Uploaded ' + name + ' (visible on the site in about a minute)', 4000); return path; }
  catch (e) { toast(e.message, 6000); return null; }
}

    <div class="row"><button class="btn" onclick="closeModal()">Later</button><button class="btn primary" onclick="closeModal();A.sec='github';location.hash='#admin';renderAdmin()">Set up now</button></div>`);

    inp.onchange = async () => { const f = inp.files[0]; if (!f) return;
      if (!/^google[\w-]+\.html$/.test(f.name)) { toast('That is not the Google verification file (it starts with “google” and ends with .html).', 6000); return; }
      try { toast('Uploading…', 30000); await GH.put(f.name, await fileB64(f), 'Google Search Console verification'); toast('Uploaded. Wait 2 minutes, then tap Verify in Search Console.', 6000); } catch (e) { toast(e.message, 6000); } };
    inp.click();
  },
  copyRules() { navigator.clipboard.writeText(fbRules()).then(() => toast('Rules copied — paste them in Firebase → Firestore → Rules'), () => toast('Copy blocked: select the text and copy it')); },
  async fbApprove(t) {
    const e = t.dataset.e, r = (FB.regs || []).find(x => x.id === e) || {};
    try { await FB.db.doc('roster/' + e).set({ name: r.name || '', roll: r.roll || '', course: r.course || '', t: new Date().toISOString() }); await FB.db.doc('registrations/' + e).delete(); toast('Approved ' + e); fbAdminLists(); }
    catch (er) { toast(er.message, 6000); }
  },
  fbReject(t) { const e = t.dataset.e; confirmBox(`Reject the registration from ${esc(e)}?`, async () => { try { await FB.db.doc('registrations/' + e).delete(); fbAdminLists(); } catch (er) { toast(er.message); } }, 'Reject'); },
  fbRemove(t) { const e = t.dataset.e; confirmBox(`Remove ${esc(e)}? They lose access to course material.`, async () => { try { await FB.db.doc('roster/' + e).delete(); fbAdminLists(); } catch (er) { toast(er.message); } }, 'Remove'); },
  async fbMigrate() {
    if (!(FB.on && FB.user && FB.user.inst)) { toast('Sign in with Google first'); return; }
    try {
      const list = (SITE.students || []).map(x => x.toLowerCase()).filter(x => x !== 'student@iitbbs.ac.in');
      for (const e of list) await FB.db.doc('roster/' + e).set({ name: '', roll: '', course: '', t: new Date().toISOString() });
      SITE.students = []; dirty(); toast(`${list.length} students moved. Publishing…`, 4000);
      await publish();
    } catch (er) { toast(er.message, 6000); }
  },
  async approve() {
    const found = ($('#approveTa').value.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g) || []).map(e => e.toLowerCase());
    if (!found.length) { toast('No email addresses found in that text'); return; }
    if (fbCfg()) {
      if (!(FB.on && FB.user && FB.user.inst)) { toast('Sign in with Google as the instructor first'); return; }
      try { for (const e of new Set(found)) await FB.db.doc('roster/' + e).set({ name: '', roll: '', course: '', t: new Date().toISOString() }, { merge: true });
        $('#approveTa').value = ''; toast(`Approved ${new Set(found).size} student(s)`); fbAdminLists(); } catch (er) { toast(er.message, 6000); }
      return;
    }
    const have = new Set((SITE.students || []).map(e => e.toLowerCase()));
    const fresh = [...new Set(found)].filter(e => !have.has(e));
    SITE.students = [...(SITE.students || []), ...fresh]; dirty(); renderAdmin();
    toast(fresh.length ? `Approved ${fresh.length} new student${fresh.length > 1 ? 's' : ''}. Tap Publish to make it live.` : 'All those students were already approved', 4000);
  },
  copyBackup() { navigator.clipboard.writeText(JSON.stringify(SITE, null, 2)).then(() => toast('All content copied. Paste it into a text file to keep it safe.', 4000), () => toast('Copy was blocked by the browser')); },
  restore() {
    let j; try { j = JSON.parse($('#restoreTa').value); if (!j.courses) throw 0; } catch (e) { toast('That text is not a valid backup'); return; }
    confirmBox('Replace all current content with this backup? (You still need to Publish afterwards.)', () => { SITE = normalize(j); dirty(); toast('Backup restored — click Publish to put it live'); renderAdmin(); }, 'Restore');
  },
  reset() { confirmBox('Replace everything with the original starter content?', () => { SITE = normalize(clone(DEFAULT_SITE)); dirty(); renderAdmin(); }, 'Reset'); }
};

/* =====================================================================
   ADMIN PASSWORD — your GitHub key, locked with your password (AES-256-GCM,
   PBKDF2-SHA256 600k rounds) and saved as admin-lock.json in the repository.
   The file is public, but it is useless without the password.
   ===================================================================== */
const LOCK_FILE = 'admin-lock.json', LOCK_ITER = 600000;
const b64e = u8 => btoa(String.fromCharCode(...u8)), b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function lockKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function lockToken(token, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const c = GH.cfg(), payload = JSON.stringify({ token, owner: c.owner, repo: c.repo });
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await lockKey(pass, salt, LOCK_ITER), new TextEncoder().encode(payload)));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: LOCK_ITER, salt: b64e(salt), iv: b64e(iv), data: b64e(data), saved: new Date().toISOString() };
}
async function unlockToken(lock, pass) {
  try {
    const k = await lockKey(pass, b64d(lock.salt), +lock.iter || LOCK_ITER);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(lock.iv) }, k, b64d(lock.data))));
  } catch (e) { throw new Error('Wrong password. Please try again.'); }
}
let ADMIN_LOCK;   /* undefined = not checked yet, null = no admin password set */
async function loadAdminLock() {
  if (ADMIN_LOCK !== undefined) return ADMIN_LOCK;
  try {
    const r = await fetch(LOCK_FILE + '?v=' + Date.now(), { cache: 'no-store' });
    const j = r.ok ? await r.json() : null;
    ADMIN_LOCK = j && j.data && j.salt && j.iv ? j : null;
  } catch (e) { ADMIN_LOCK = null; }
  return ADMIN_LOCK;
}
async function saveAdminPassword(pass) {
  const c = GH.cfg(); if (!(c.ok && c.token)) throw new Error('Connect with your GitHub key first.');
  const lock = await lockToken(c.token, pass);
  await GH.put(LOCK_FILE, b64utf8(JSON.stringify(lock, null, 2)), 'Set admin password');
  ADMIN_LOCK = lock;
}

function bindAdminPass(lock) {
  $('#apPass').focus();
  $('#adminPass').onsubmit = async e => {
    e.preventDefault(); const err = $('#apErr'), go = $('#apGo'); err.textContent = '';
    const pass = $('#apPass').value; if (!pass) return;
    go.disabled = true; go.innerHTML = '<span class="spin"></span> Unlocking…';
    try {
      const k = await unlockToken(lock, pass);
      const c = GH.cfg(); c.token = k.token; if (k.owner) c.owner = k.owner; if (k.repo) c.repo = k.repo; c.ok = false; GH.save(c);
      try { await GH.connect(); }
      catch (x) {
        const c2 = GH.cfg(); c2.token = ''; c2.ok = false; GH.save(c2);
        throw new Error(/did not accept/.test(x.message) ? 'Your password is right, but the GitHub key saved with it has expired. Sign in with a new GitHub key (link below), then set your admin password again.' : x.message);
      }
      if (!hasDraft()) SITE = normalize(await loadPublished());
      toast('Welcome back', 2500); route();
    } catch (x) { err.textContent = x.message; go.disabled = false; go.textContent = 'Sign in'; $('#apPass').select(); }
  };
}
