<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajit Kumar Patra · Power Electronics</title>
<meta name="description" content="Ajit Kumar Patra — PhD scholar in power electronics at IIT Bhubaneswar. Research on triple active bridge converters, plus lectures, notes, quizzes and live classes for students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script>
  /* MathJax: renders LaTeX in lecture notes and quizzes.  Inline: \( ... \)   Display: $$ ... $$ */
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    startup: { typeset: false },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'input'] }
  };
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f0ede6; --ink:#16202e; --ink-2:#4a5566; --ink-3:#7a8494;
  --line:#e2ddd2; --accent:#b4562a; --accent-ink:#ffffff; --accent-soft:#f6e6dc; --navy:#1d3557;
  --ok:#2f7d4f; --ok-soft:#e2f1e7; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b33a3a; --bad-soft:#f8e1e1;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 4px 16px rgba(22,32,46,.06);
  --radius:12px; --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface-2:#1c2531; --ink:#e8e4dc; --ink-2:#aab2bf; --ink-3:#7d8796;
  --line:#2a3443; --accent:#e07a45; --accent-ink:#1a0f08; --accent-soft:#3a2418; --navy:#9fb7d9;
  --ok:#5fc489; --ok-soft:#173326; --warn:#e3a944; --warn-soft:#352914; --bad:#ec7a7a; --bad-soft:#3b1d1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.5vw,3.1rem)} h2{font-size:1.75rem} h3{font-size:1.2rem}
p{margin:0 0 1em}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--serif);font-weight:600;font-size:1.08rem}
.brand:hover{text-decoration:none}
.mark{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--bg);display:grid;place-items:center;font:600 .9rem var(--mono)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{color:var(--ink-2);padding:7px 11px;border-radius:8px;font-size:.94rem;font-weight:500}
nav.main a:hover{background:var(--surface-2);color:var(--ink);text-decoration:none}
nav.main a.on{color:var(--ink);background:var(--surface-2)}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--ink-3)}
.menu-btn{display:none}
@media (max-width:880px){
  nav.main{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  .menu-btn{display:grid}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand span:last-child{display:none}#userSlot .btn{padding:6px 12px}}

/* ---------- buttons, chips, cards ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:.95rem}
.btn:hover{text-decoration:none;border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 13px;font-size:.86rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:.8rem;font-weight:500;border:1px solid var(--line)}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
section.block{padding:64px 0;border-bottom:1px solid var(--line)}
.eyebrow{font:500 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.page-head{padding:44px 0 26px}
.crumbs{font-size:.88rem;color:var(--ink-3);margin-bottom:12px}
.crumbs a{color:var(--ink-2)}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- home ---------- */
.hero{padding:70px 0 60px;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:1.12rem;color:var(--ink-2);max-width:40em}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.figure figcaption{font-size:.82rem;color:var(--ink-3);margin-top:8px;text-align:center}
.figure svg{width:100%;height:auto;display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
@media (max-width:640px){.facts{grid-template-columns:1fr}}
.fact{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.fact b{display:block;font-size:.78rem;font-family:var(--mono);color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.rcard .sym{font:600 1.5rem var(--serif);color:var(--accent);margin-bottom:10px}
.tabs-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:.9rem;font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pub{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.pub:first-child{border-top:0}
.pub .t{font-family:var(--serif);font-weight:600;font-size:1.05rem}
@media (max-width:640px){.pub{grid-template-columns:1fr;gap:4px}}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
@media (max-width:640px){.timeline li{grid-template-columns:1fr;gap:2px}}
.news li{list-style:none;display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.news{padding:0;margin:0}
.news li:first-child{border-top:0}
.news .d{font-family:var(--mono);font-size:.85rem;color:var(--ink-3);min-width:80px}
.contact-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ---------- teaching ---------- */
.course-card{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.course-card .band{position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--accent))}
.course-card h3{margin:4px 0 0}
.course-card .meta{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.next-live{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy);color:var(--bg);border-radius:var(--radius);padding:20px 24px;margin-bottom:26px}
.next-live h3{color:var(--bg);margin:2px 0}
.next-live .faint{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.next-live .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.announce{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.announce:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}

/* ---------- course ---------- */
.course-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.course-tabs a{padding:11px 14px;color:var(--ink-2);font-weight:500;font-size:.94rem;border-bottom:2px solid transparent;white-space:nowrap}
.course-tabs a:hover{text-decoration:none;color:var(--ink)}
.course-tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.lec-row{display:grid;grid-template-columns:54px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;color:var(--ink)}
.lec-row:hover{text-decoration:none;border-color:var(--ink-3)}
.lec-num{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:600 1rem var(--mono);color:var(--ink-2)}
.lec-row.done .lec-num{background:var(--ok-soft);color:var(--ok)}
.lec-row h4{margin:0 0 2px;font-size:1.05rem}
@media (max-width:640px){.lec-row{grid-template-columns:44px 1fr}.lec-row .right{grid-column:2}}

/* ---------- lecture page ---------- */
.lec-layout{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
@media (max-width:960px){.lec-layout{grid-template-columns:1fr}}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#1d3557,#16202e 60%,#3a1f12);color:#fff;display:grid;place-items:center;border:0;width:100%;padding:0}
.video .play{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);transition:transform .15s}
.video:hover .play{transform:scale(1.07)}
.video .vt{position:absolute;left:20px;bottom:16px;right:20px;text-align:left;font-family:var(--serif);font-size:1.15rem}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.notes{font-size:1.02rem}
.notes h3{margin-top:1.6em}
.notes .box{background:var(--surface-2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:1em 0}
.notes figure{margin:1.2em 0;text-align:center}
.notes figure svg{max-width:440px;width:100%}
.notes figcaption{font-size:.85rem;color:var(--ink-3)}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.side h4{font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 10px;font-weight:600}
.side .card{padding:18px;margin-bottom:16px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink)}
.doc:first-of-type{border-top:0}
.doc:hover{text-decoration:none}
.doc:hover .dt{color:var(--accent)}
.ftype{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font:600 .68rem var(--mono);flex:none;background:var(--surface-2);color:var(--ink-2)}
.ftype.pdf{background:var(--bad-soft);color:var(--bad)} .ftype.slides{background:var(--warn-soft);color:var(--warn)} .ftype.code{background:var(--ok-soft);color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:12px;margin:30px 0 10px}

/* ---------- discussion ---------- */
.post{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.ava{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 .8rem var(--mono);color:var(--ink-2)}
.ava.inst{background:var(--accent);color:var(--accent-ink)}
.post .who{font-weight:600;font-size:.92rem}
.post .when{font-size:.8rem;color:var(--ink-3);margin-left:6px}
.post .body{margin:4px 0 6px;white-space:pre-wrap}
.replies{margin-left:6px;padding-left:16px;border-left:2px solid var(--line)}
.replies .post{border-top:0;padding:10px 0}
textarea,input[type=text],input[type=email],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea:focus,input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.linkish{background:none;border:0;padding:0;color:var(--ink-3);font-size:.84rem}
.linkish:hover{color:var(--accent)}

/* ---------- quiz ---------- */
.q{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:14px}
.q .qn{font:500 .78rem var(--mono);color:var(--ink-3);margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:10px;font-size:.93rem;color:var(--ink-2);display:none}
.checked .why{display:block}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .big{font:600 2.4rem var(--serif)}

/* ---------- live ---------- */
.session{display:grid;grid-template-columns:86px 1fr auto;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px}
.datebox{text-align:center;border-radius:10px;background:var(--surface-2);padding:8px 0}
.datebox b{display:block;font:600 1.6rem var(--serif);line-height:1.1}
.datebox span{font:500 .72rem var(--mono);text-transform:uppercase;color:var(--ink-3)}
.session.now{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.session.past{opacity:.7}
.session .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
@media (max-width:640px){.session{grid-template-columns:70px 1fr}.session .acts{grid-column:1/-1;justify-content:flex-start}}

/* ---------- library ---------- */
.filters{display:grid;grid-template-columns:1fr 200px 160px;gap:10px;margin-bottom:20px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
.doc-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.doc-table th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.doc-table td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.doc-table tr:last-child td{border-bottom:0}
@media (max-width:640px){.doc-table .hide-sm{display:none}}

/* ---------- assignments ---------- */
.asg{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.asg + .asg{margin-top:12px}

/* ---------- lock, modal, toast ---------- */
.lock{max-width:520px;margin:30px auto;text-align:center;padding:40px 30px}
.lock .ic{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;place-items:center;z-index:80;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--surface);border-radius:16px;max-width:440px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal label{display:block;font-size:.88rem;font-weight:500;margin:12px 0 6px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.note{font-size:.84rem;color:var(--ink-3);background:var(--surface-2);padding:10px 12px;border-radius:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.user-pill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.88rem}
.user-pill .ava{width:30px;height:30px;font-size:.72rem}
.notes figure img{max-width:100%;border-radius:8px}
.notes ul{padding-left:1.3em}
/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:220px 1fr;gap:30px;padding:30px 0 140px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:1fr}}
.anav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.anav{position:static;flex-direction:row;flex-wrap:wrap}}
.anav button{text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:.93rem}
.anav button:hover{background:var(--surface-2);color:var(--ink)}
.anav button.on{background:var(--ink);color:var(--bg)}
.anav .sep{height:1px;background:var(--line);margin:8px 0}
.apanel h2{font-size:1.6rem}
.apanel h3{margin-top:26px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.86rem;font-weight:600;margin-bottom:5px}
.help{font-size:.8rem;color:var(--ink-3);margin-top:4px}
.frow{display:flex;gap:8px;align-items:center}
.frow input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media (max-width:640px){.two,.three{grid-template-columns:1fr}}
.arow{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:14px}
@media (max-width:640px){.arow{grid-template-columns:1fr}}
.aa{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.arow .ttl{font-weight:600}
.icon-btn.sm{width:32px;height:32px;font-size:.9rem}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.ck{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0 14px}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
input[type=date],input[type=datetime-local],input[type=number],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input[type=color]{width:60px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 20px}

/* Notes format: "# Heading", "> highlighted box", "- list item", "$$ maths $$",
   "![caption](files/picture.png)", blank line = new paragraph. Blocks starting with < are raw HTML. */
function mdLite(src) {
  if (!src) return '';
  const out = [];
  for (const blk of String(src).replace(/\r/g, '').split(/\n[ \t]*\n/)) {
    const t = blk.trim(); if (!t) continue;
    if (t[0] === '<') { out.push(t); continue; }
    const lines = t.split('\n'); let mode = null, buf = [];
    const flush = () => {
      if (!buf.length) return;
      if (mode === 'p') out.push(`<p>${inl(buf.join(' '))}</p>`);
      else if (mode === 'ul') out.push('<ul>' + buf.map(x => `<li>${inl(x)}</li>`).join('') + '</ul>');
      else if (mode === 'box') out.push(`<div class="box">${inl(buf.join(' '))}</div>`);
      buf = []; mode = null;
    };
    const add = (m, x) => { if (mode !== m) flush(); mode = m; buf.push(x); };
    for (let i = 0; i < lines.length; i++) {
      const L = lines[i].trim(); let m;
      if (!L) continue;
      if ((m = L.match(/^(#{1,3})\s+(.*)/))) { flush(); const tag = m[1].length === 1 ? 'h3' : 'h4'; out.push(`<${tag}>${inl(m[2])}</${tag}>`); }
      else if (L.startsWith('$$')) { flush(); let math = L; while (!(math.length > 2 && math.endsWith('$$')) && i + 1 < lines.length) math += '\n' + lines[++i]; out.push(`<div class="math">${esc(math)}</div>`); }
      else if ((m = L.match(/^!\[(.*?)\]\((.*?)\)$/))) { flush(); out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}">${m[1] ? `<figcaption>${esc(m[1])}</figcaption>` : ''}</figure>`); }
      else if (/^[-*] /.test(L)) add('ul', L.slice(2));
      else if (L.startsWith('>')) add('box', L.replace(/^>\s?/, ''));
      else add('p', L);
    }
    flush();
  }
  return out.join('\n');
}

/* ---------- helpers ---------- */
const done = cid => store.get('done_' + cid, []);
function toggleDone(cid, n) {
  let d = done(cid); d = d.includes(n) ? d.filter(x => x !== n) : [...d, n];
  store.set('done_' + cid, d); route();
}
function progress(c) { return c.lectures.length ? Math.round(done(c.id).filter(n => c.lectures.some(l => l.n === n)).length / c.lectures.length * 100) : 0; }
function allLive() {
  return SITE.courses.flatMap(c => c.live.filter(s => s.start).map(s => ({ ...s, course: c })))
    .sort((a, b) => new Date(a.start) - new Date(b.start));
}
function liveState(s) {
  const now = Date.now(), st = new Date(s.start).getTime(), en = st + (+s.mins || 60) * 60000;
  return now < st ? 'upcoming' : now <= en ? 'now' : 'past';
}
function countdown(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (isNaN(ms)) return '';
  if (ms <= 0) return 'now';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return d ? `in ${d}d ${h}h` : h ? `in ${h}h ${m}m` : `in ${m} min`;
}
function gcalLink(s) {
  const f = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const end = new Date(new Date(s.start).getTime() + (+s.mins || 60) * 60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(s.course.title + ': ' + s.title) +
    '&dates=' + f(s.start) + '/' + f(end) + '&details=' + encodeURIComponent('Join: ' + (s.link || 'link will be shared on the course page')) +
    (s.link ? '&location=' + encodeURIComponent(s.link) : '');
}
function allDocs() {
  const out = [];
  SITE.courses.forEach(c => c.lectures.forEach(l => (l.docs || []).forEach(d => out.push({ ...d, course: c, lecture: l }))));
  return out;
}
const TYPE_LABEL = { pdf: 'PDF', slides: 'PPT', code: 'CODE', notes: 'TXT', image: 'IMG', other: 'FILE' };
function docLink(d) {
  return d.url ? `href="${esc(d.url)}" target="_blank" rel="noopener"` : `href="javascript:void 0" onclick="toast('File not uploaded yet')"`;
}
function openLink(url, what) {
  if (!url) { toast(what + ' link will be added before the class'); return; }
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.click();
}
function typeset(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {}); else if ((typeset.n = (typeset.n || 0) + 1) < 30) setTimeout(() => typeset(el), 400); }

function bindQuiz(c, qid) {
  const q = c.quizzes.find(x => x.id === qid), f = $('#quizForm'); if (!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    const ans = q.questions.map((x, i) => { const s = f.querySelector(`input[name=q${i}]:checked`); return s ? +s.value : null; });
    if (ans.includes(null)) { toast('Answer all questions first'); $('#qq' + ans.indexOf(null)).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    let score = 0;
    q.questions.forEach((x, i) => {
      $('#qq' + i).classList.add('checked');
      const r = $(`#o${i}_${x.answer}`); if (r) r.classList.add('right');

    });
    const key = `quiz_${c.id}_${q.id}`, best = Math.max(score, store.get(key, 0)); store.set(key, best);
    const pct = Math.round(score / q.questions.length * 100);
    $('#quizRes').innerHTML = `<div class="card score"><span class="big">${score}/${q.questions.length}</span><div><b>${pct >= 80 ? 'Well done!' : pct >= 50 ? 'Good effort.' : 'Review the lecture and try again.'}</b><br><span class="muted">Best score: ${best}/${q.questions.length}</span></div></div>`;

/* =====================================================================
   GITHUB — saves content.json and uploaded files into your repository
   ===================================================================== */
const GH = {
  cfg() { return Object.assign({ owner: 'ajitpatra861-creator', repo: 'ajitpatra861-creator.github.io', token: '', branch: '', ok: false }, store.get('gh', {})); },
  save(c) { store.set('gh', c); },
  async api(path, opts = {}) {
    const c = this.cfg();
    let r;
    try {
      r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {
        ...opts, cache: 'no-store',
        headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
      });
    } catch (e) { throw new Error('Could not reach GitHub. Check your internet, or open the Admin page on your live website (this preview cannot connect).'); }
    if (r.status === 401) throw new Error('GitHub did not accept the key. It may be mistyped or expired — create a new one.');
    if (r.status === 403) throw new Error('The key does not have permission. Give it "Contents: Read and write" for this repository.');
    return r;
  },
  async connect() {
    const r = await this.api('');
    if (r.status === 404) throw new Error('Repository not found. Check the user name and repository name, and that the key includes this repository.');
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw new Error('The key can read but not write. Set "Contents" to "Read and write".');
    const c = this.cfg(); c.branch = j.default_branch || 'main'; c.ok = true; this.save(c);
  },
  pathUrl(p) { return '/contents/' + p.split('/').map(encodeURIComponent).join('/'); },
  async get(p) {
    const r = await this.api(this.pathUrl(p) + '?ref=' + encodeURIComponent(this.cfg().branch));
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    return r.json();
  },
  async put(p, b64, msg) {
    const old = await this.get(p);
    const r = await this.api(this.pathUrl(p), { method: 'PUT', body: JSON.stringify({ message: msg, content: b64, branch: this.cfg().branch, ...(old ? { sha: old.sha } : {}) }) });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error('Saving failed (' + r.status + ') ' + m); }
    return r.json();
  }
};
function b64utf8(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64utf8(b) { const bin = atob(b.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); }
const fileB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

async function uploadFile(file) {
  if (!GH.cfg().ok) { needGitHub('upload files'); return null; }
  if (file.size > 25 * 1048576) { toast('That file is over 25 MB. Put it on Google Drive and paste the share link instead.', 5000); return null; }
  const name = file.name.replace(/[^\w.\-]+/g, '_'), path = 'files/' + name;
  toast('Uploading ' + name + '…', 60000);
  try { await GH.put(path, await fileB64(file), 'Upload ' + name); toast('Uploaded ' + name + ' (visible on the site in about a minute)', 4000); return path; }
  catch (e) { toast(e.message, 6000); return null; }
}
function needGitHub(what) {
  openModal(`<h3>Connect GitHub first</h3><p class="muted">To ${what}, connect this admin page to your GitHub repository (one-time setup).</p>
    <div class="row"><button class="btn" onclick="closeModal()">Later</button><button class="btn primary" onclick="closeModal();A.sec='github';location.hash='#admin';renderAdmin()">Set up now</button></div>`);

  }, 'Discard changes');

async function loadPublished() {
  /* live content: from GitHub if connected (always fresh), else content.json next to this page, else built-in */
  try {
    if (GH.cfg().ok) { const f = await GH.get('content.json'); if (f && f.content) return JSON.parse(fromB64utf8(f.content)); }
  } catch (e) {}
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
    const r = await fetch('content.json?v=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
    if (r.ok) return await r.json();
  } catch (e) {}
  return clone(DEFAULT_SITE);
}

function ytId(v) { v = String(v || '').trim(); if (!v) return ''; if (/^[\w-]{11}$/.test(v)) return v; const m = v.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : ''; }

function F(label, obj, key, type = 'text', x = {}) {
  const id = 'b' + (bid++); B[id] = { obj, key, type, after: x.after, onUpload: x.onUpload };
  const v = obj[key], ph = x.ph ? ` placeholder="${esc(x.ph)}"` : '';
  let input;
  if (type === 'textarea' || type === 'notes') input = `<textarea id="${id}" data-b="${id}" rows="${x.rows || 3}"${ph}${type === 'notes' ? ' style="font-family:var(--mono);font-size:.88rem;min-height:300px"' : ''}>${esc(v || '')}</textarea>`;
  else if (type === 'lines') input = `<textarea id="${id}" data-b="${id}" rows="${x.rows || 3}"${ph}>${esc((v || []).join('\n'))}</textarea>`;
  else if (type === 'select') input = `<select id="${id}" data-b="${id}">${x.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(v ?? '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  else if (type === 'check') return `<label class="ck"><input type="checkbox" data-b="${id}" ${v ? 'checked' : ''}> ${label}</label>`;
  else if (type === 'dt') input = `<input type="datetime-local" id="${id}" data-b="${id}" value="${esc(toLocal(v))}">`;
  else if (type === 'date') input = `<input type="date" id="${id}" data-b="${id}" value="${esc(v || '')}">`;
  else if (type === 'num') input = `<input type="number" min="0" id="${id}" data-b="${id}" value="${esc(v ?? '')}">`;
  else if (type === 'yt') input = `<input type="text" id="${id}" data-b="${id}" value="${v ? 'https://youtu.be/' + esc(v) : ''}" placeholder="Paste the YouTube link here">`;
  else if (type === 'color') input = `<input type="color" id="${id}" data-b="${id}" value="${esc(v || '#b4562a')}">`;
  else input = `<input type="text" id="${id}" data-b="${id}" value="${esc(v ?? '')}"${ph}>`;
  const up = x.upload ? `<button type="button" class="btn small" data-up="${id}" data-accept="${esc(x.upload)}">Upload…</button>` : '';
  return `<div class="fld"><label for="${id}">${label}</label>${up ? `<div class="frow">${input}${up}</div>` : input}${x.help ? `<div class="help">${x.help}</div>` : ''}</div>`;
}
function onBind(e) {
  const id = e.target.dataset && e.target.dataset.b; if (!id || !B[id]) return;
  const b = B[id]; let v = b.type === 'check' ? e.target.checked : e.target.value;
  if (b.type === 'num') v = v === '' ? '' : Number(v);
  if (b.type === 'lines') v = v.split('\n').map(s => s.trim()).filter(Boolean);
  if (b.type === 'dt') v = v ? v + ':00+05:30' : '';
  if (b.type === 'yt') { v = ytId(v); e.target.style.borderColor = e.target.value && !v ? 'var(--bad)' : ''; }
  b.obj[b.key] = v; dirty(); if (b.after) b.after();
}
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);

function listUI(arr, rowFn, o = {}) {
  const lid = 'l' + (bid++); LISTS[lid] = { arr, o };
  const btn = (act, i, txt, cls = 'icon-btn sm', dis = false) => `<button type="button" class="${cls}" data-act="${act}" data-l="${lid}" data-i="${i}" ${dis ? 'disabled' : ''} title="${act}">${txt}</button>`;
  return `<div>${arr.length ? arr.map((x, i) => `<div class="arow"><div>${rowFn(x, i)}</div><div class="aa">
      ${o.reorder !== false ? btn('up', i, '↑', 'icon-btn sm', i === 0) + btn('down', i, '↓', 'icon-btn sm', i === arr.length - 1) : ''}
      ${o.edit ? btn('edit', i, 'Edit', 'btn small') : ''}${btn('del', i, 'Delete', 'btn small danger')}</div></div>`).join('')
    : `<div class="empty" style="margin-bottom:12px">${o.empty || 'Nothing here yet.'}</div>`}
    <button type="button" class="btn small primary" data-act="add" data-l="${lid}">+ ${o.addLabel || 'Add'}</button></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-up],[data-asec],[data-a]'); if (!t || !A.on) return;
  if (t.dataset.asec) { A.sec = t.dataset.asec; A.edit = null; A.cid = null; renderAdmin(true); return; }
  if (t.dataset.a) { await ADMIN_ACTIONS[t.dataset.a](t); return; }
  if (t.dataset.up) {
    const b = B[t.dataset.up]; if (!GH.cfg().ok) { needGitHub('upload files'); return; }
    const inp = document.createElement('input'); inp.type = 'file'; if (t.dataset.accept && t.dataset.accept !== '*') inp.accept = t.dataset.accept;
    inp.onchange = async () => { const f = inp.files[0]; if (!f) return; const p = await uploadFile(f); if (!p) return;
      b.obj[b.key] = p; if (b.onUpload) b.onUpload(f, p); dirty(); renderAdmin(); };
    inp.click(); return;
  }
  const L = LISTS[t.dataset.l]; if (!L) return; const i = +t.dataset.i, arr = L.arr;
  if (t.dataset.act === 'add') { arr.push(L.o.add()); dirty(); if (L.o.edit) L.o.edit(arr.length - 1); else renderAdmin(); }
  else if (t.dataset.act === 'del') confirmBox(`Delete “${esc(L.o.name ? L.o.name(arr[i]) : 'this item')}”?`, () => { arr.splice(i, 1); dirty(); renderAdmin(); });
  else if (t.dataset.act === 'up' && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; dirty(); renderAdmin(); }
  else if (t.dataset.act === 'down' && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; dirty(); renderAdmin(); }
  else if (t.dataset.act === 'edit') L.o.edit(i);
});

const ADMIN_ACTIONS = {
  async publish() { await publish(); },
  discard() { discardDraft(); },
  async connect() {
    const c = GH.cfg(); c.owner = $('#ghOwner').value.trim(); c.repo = $('#ghRepo').value.trim();
    const tk = $('#ghToken').value.trim(); if (tk) c.token = tk; c.ok = false; GH.save(c);
    if (!c.token) { toast('Paste your GitHub key first'); return; }
    toast('Connecting…', 30000);
    try {
      await GH.connect();
      if (!hasDraft()) { SITE = normalize(await loadPublished()); }
      toast('Connected to GitHub ✓', 3000); renderAdmin();
    } catch (e) { toast(e.message, 7000); renderAdmin(); }
  },
  disconnect() { confirmBox('This removes the GitHub key from this browser. Your website is not affected.', () => { GH.save({ owner: GH.cfg().owner, repo: GH.cfg().repo }); renderAdmin(); }, 'Disconnect'); },
  back() { A.edit = null; renderAdmin(true); },
  course(t) { A.cid = t.dataset.c; A.sub = 'details'; A.edit = null; renderAdmin(true); },
  sub(t) { A.sub = t.dataset.s; A.edit = null; renderAdmin(true); },
  addCourse() {
    const c = { id: uid('c'), code: '', title: 'New course', term: '', role: 'Instructor', color: '#1d3557', sample: false, blurb: '', lectures: [], live: [], quizzes: [], assignments: [], discussion: {} };
    SITE.courses.push(c); dirty(); A.cid = c.id; A.sub = 'details'; renderAdmin(true);
  },
  delCourse() {
    const c = courseById(A.cid);
    confirmBox(`Delete the course “${esc(c.title)}” with all its lectures, quizzes and assignments? Uploaded files stay in your repository.`, () => {
      SITE.courses = SITE.courses.filter(x => x !== c); A.cid = null; dirty(); renderAdmin(true);
    });
  },
  preview() { const v = $('#notesPrev'), ta = $('#notesTa'); if (!v) return; if (v.style.display === 'block') { v.style.display = 'none'; return; }
    v.innerHTML = mdLite(ta.value) || '<p class="faint">Nothing to preview.</p>'; v.style.display = 'block'; typeset(v); },
  async insertImg() {
    if (!GH.cfg().ok) { needGitHub('upload pictures'); return; }
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => { const f = inp.files[0]; if (!f) return; const p = await uploadFile(f); if (!p) return;
      const ta = $('#notesTa'), pos = ta.selectionStart || ta.value.length, ins = `\n\n![Figure caption](${p})\n\n`;
      ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(pos); ta.dispatchEvent(new Event('input', { bubbles: true })); };
    inp.click();
  },
  approve() {
    const found = ($('#approveTa').value.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g) || []).map(e => e.toLowerCase());
    if (!found.length) { toast('No email addresses found in that text'); return; }
    const have = new Set((SITE.students || []).map(e => e.toLowerCase()));
    const fresh = [...new Set(found)].filter(e => !have.has(e));
    SITE.students = [...(SITE.students || []), ...fresh]; dirty(); renderAdmin();
    toast(fresh.length ? `Approved ${fresh.length} new student${fresh.length > 1 ? 's' : ''}. Tap Publish to make it live.` : 'All those students were already approved', 4000);
  },
  copyBackup() { navigator.clipboard.writeText(JSON.stringify(SITE, null, 2)).then(() => toast('All content copied. Paste it into a text file to keep it safe.', 4000), () => toast('Copy was blocked by the browser')); },
  restore() {
    let j; try { j = JSON.parse($('#restoreTa').value); if (!j.courses) throw 0; } catch (e) { toast('That text is not a valid backup'); return; }
    confirmBox('Replace all current content with this backup? (You still need to Publish afterwards.)', () => { SITE = normalize(j); dirty(); toast('Backup restored — click Publish to put it live'); renderAdmin(); }, 'Restore');
  },
  reset() { confirmBox('Replace everything with the original starter content?', () => { SITE = normalize(clone(DEFAULT_SITE)); dirty(); renderAdmin(); }, 'Reset'); }
};

          <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button type="button" class="btn small" data-a="insertImg">Insert picture</button><button type="button" class="btn small" data-a="preview">Preview notes</button></div>
          ${F('', l, 'notes', 'notes').replace('<div class="fld"><label for="', '<div><label style="display:none" for="').replace(/id="(b\d+)" data-b/, 'id="notesTa" data-b')}
          <div id="notesPrev" class="card notes" style="display:none;margin-top:10px"></div>${cheat()}</div>
        <h3>Documents for this lecture</h3>` +
        listUI(l.docs, d => `<div class="two">${F('Title', d, 'title')}${F('Type', d, 'type', 'select', { options: [['pdf', 'PDF'], ['slides', 'Slides'], ['code', 'Code'], ['image', 'Image'], ['other', 'Other']] })}</div>
          ${F('File', d, 'url', 'text', { upload: '*', ph: 'Upload, or paste a Google Drive link', onUpload: (f) => { d.size = fmtSize(f.size); if (!d.title) d.title = f.name; const ext = f.name.split('.').pop().toLowerCase(); d.type = ext === 'pdf' ? 'pdf' : /pptx?|key/.test(ext) ? 'slides' : /^(m|py|c|slx|zip)$/.test(ext) ? 'code' : /png|jpe?g|gif|svg|webp/.test(ext) ? 'image' : 'other'; } })}`,
          { add: () => ({ title: '', type: 'pdf', url: '', size: '' }), addLabel: 'Add document', name: d => d.title || 'document' });
    } else body = `<p class="muted">Lectures are listed by their number.</p>` + listUI(c.lectures, l => `<div class="ttl">Lecture ${esc(l.n)}: ${esc(l.title)}</div><div class="faint" style="font-size:.86rem">${fmtDate(l.date)} · ${l.youtube ? 'video ✓' : 'no video'} · ${l.notes ? 'notes ✓' : 'no notes'} · ${l.docs.length} documents</div>`,
      { reorder: false, add: () => ({ n: c.lectures.reduce((m, l) => Math.max(m, +l.n || 0), 0) + 1, title: 'New lecture', date: new Date().toISOString().slice(0, 10), mins: '', youtube: '', summary: '', notes: '', docs: [] }),
        edit: i => { A.edit = i; renderAdmin(true); }, addLabel: 'Add lecture', name: l => l.title });
  }

  else if (A.sub === 'live') body = `<p class="muted">Times are IST. Paste the Google Meet / Zoom / YouTube Live link. After the class, choose the lecture that has the recording.</p>` +
    listUI(c.live, s => `${F('Title', s, 'title')}<div class="three">${F('Date & time', s, 'start', 'dt')}${F('Duration (min)', s, 'mins', 'num')}${F('Recording', s, 'lecture', 'select', { options: lecOpts })}</div>${F('Meeting link', s, 'link', 'text', { ph: 'https://meet.google.com/…' })}`,
      { reorder: false, add: () => ({ title: 'Live class', start: '', mins: 60, link: '', lecture: '' }), addLabel: 'Schedule live class', name: s => s.title });

  else if (A.sub === 'quizzes') {
    if (A.edit !== null && c.quizzes[A.edit]) {
      const q = c.quizzes[A.edit];
      q.questions.forEach(x => { while (x.options.length < 4) x.options.push(''); });
      body = `<button class="btn small" data-a="back">← All quizzes</button><h3>${esc(q.title)}</h3>
        <div class="two">${F('Quiz title', q, 'title')}${F('Linked lecture', q, 'lecture', 'select', { options: lecOpts })}</div>
        <h3>Questions</h3><p class="muted" style="font-size:.9rem">Maths works here too: \\( V_o \\). Leave unused options empty.</p>` +
        listUI(q.questions, x => `${F('Question', x, 'q', 'textarea', { rows: 2 })}<div class="two">${F('Option A', x.options, 0)}${F('Option B', x.options, 1)}${F('Option C', x.options, 2)}${F('Option D', x.options, 3)}</div>
          <div class="two" style="grid-template-columns:180px 1fr">${F('Correct answer', x, 'answer', 'select', { options: [[0, 'A'], [1, 'B'], [2, 'C'], [3, 'D']] })}${F('Explanation (shown after answering)', x, 'why')}</div>`,
          { add: () => ({ q: '', options: ['', '', '', ''], answer: 0, why: '' }), addLabel: 'Add question', name: x => x.q || 'question' });
    } else body = listUI(c.quizzes, q => `<div class="ttl">${esc(q.title)}</div><div class="faint" style="font-size:.86rem">${q.questions.length} questions${q.lecture ? ' · lecture ' + esc(q.lecture) : ''}</div>`,
      { add: () => ({ id: uid('q'), title: 'New quiz', lecture: '', questions: [{ q: '', options: ['', '', '', ''], answer: 0, why: '' }] }), edit: i => { A.edit = i; renderAdmin(true); }, addLabel: 'Add quiz', name: q => q.title });
  }

  else if (A.sub === 'assignments') body = `<p class="muted">To collect real submissions, make a <a href="https://forms.google.com" target="_blank" rel="noopener">Google Form</a> with a “File upload” question and paste its link. Files then arrive in your Google Drive.</p>` +
    listUI(c.assignments, a => `${F('Title', a, 'title')}${F('Instructions', a, 'desc', 'textarea', { rows: 3 })}<div class="two">${F('Due date & time', a, 'due', 'dt')}${F('Google Form link', a, 'form', 'text', { ph: 'https://forms.gle/…' })}</div>`,
      { add: () => ({ id: uid('a'), title: 'New assignment', desc: '', due: '', form: '' }), addLabel: 'Add assignment', name: a => a.title });

  return `<div class="crumbs"><a href="javascript:void 0" data-asec="courses">Courses</a> / ${esc(c.title)}</div><h2>${esc(c.title)}</h2>
    <div class="subtabs">${SUBS.map(([k, n]) => `<button class="tab ${A.sub === k ? 'on' : ''}" data-a="sub" data-s="${k}">${n}</button>`).join('')}
    <a class="btn small" href="#course-${c.id}" style="margin-left:auto">View on site →</a></div>${body}`;
}

function pageAdmin() {
  return `<div class="wrap admin">
    <nav class="anav">${SECS.map(([k, n]) => k === '-' ? '<div class="sep"></div>' : `<button data-asec="${k}" class="${A.sec === k ? 'on' : ''}">${n}</button>`).join('')}
      <div class="sep"></div><button data-a="publish" style="background:var(--accent);color:var(--accent-ink)">Publish to website</button></nav>
    <div class="apanel" id="apanel"></div></div>`;
}
function renderAdmin(scrollTop) {
  if (!A.on) return;
  B = {}; LISTS = {};
  const p = $('#apanel'); if (!p) return;
  p.innerHTML = adminSection();
  document.querySelectorAll('.anav button[data-asec]').forEach(b => b.classList.toggle('on', b.dataset.asec === A.sec));
  if (scrollTop) window.scrollTo(0, 0);
}

/* =====================================================================
   ROUTER — #teaching, #course-pe-quizzes, #lec-pe-2, #quiz-pe-q1, #admin
   ===================================================================== */
function route() {
  const h = (location.hash || '#home').slice(1), p = h.split('-');
  let html, nav = p[0], after = null;
  A.on = p[0] === 'admin';
  switch (p[0]) {
    case 'about': case 'research': case 'publications': case 'contact':
      html = pageHome(); after = () => { const s = $('#s-' + p[0]); if (s) s.scrollIntoView(); }; break;
    case 'teaching': html = pageTeaching(); break;
    case 'register': html = pageRegister(); nav = 'teaching'; break;
    case 'live': html = pageLive(); break;
    case 'library': html = pageLibrary(); after = () => { if ($('#fq')) { ['fq', 'fc', 'ft'].forEach(id => $('#' + id).addEventListener('input', filterDocs)); filterDocs(); } }; break;
    case 'course': { const c = courseById(p[1]); html = c ? pageCourse(c, p[2] || 'lectures') : notFound(); nav = 'teaching'; break; }
    case 'lec': { const c = courseById(p[1]); html = c ? pageLecture(c, +p[2]) : notFound(); nav = 'teaching'; if (c) after = () => renderQA(c, +p[2]); break; }
    case 'quiz': { const c = courseById(p[1]); html = c ? pageQuiz(c, p[2]) : notFound(); nav = 'teaching'; if (c) after = () => bindQuiz(c, p[2]); break; }
    case 'admin': html = pageAdmin(); after = () => renderAdmin(); break;
    default: html = pageHome(); nav = 'home';
  }
  app.innerHTML = html;
  if (!['about', 'research', 'publications', 'contact'].includes(p[0])) window.scrollTo(0, 0);
  if ($('#pubTabs')) { renderPubs('all'); $('#pubTabs').onclick = e => { if (e.target.dataset.f) renderPubs(e.target.dataset.f); }; }
  const v = $('#vid'); if (v) v.onclick = () => { v.outerHTML = `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.dataset.yt)}?autoplay=1&rel=0" title="Lecture video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`; };
  after && after();
  document.querySelectorAll('nav.main a').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  $('#nav').classList.remove('open');
  $('#updated').textContent = 'Last updated ' + (SITE.updated || '');
  updateDraftBar();
  if (!A.on) typeset(app);
}
setInterval(() => document.querySelectorAll('[data-cd]').forEach(el => el.textContent = countdown(el.dataset.cd)), 30000);
window.addEventListener('hashchange', route);

(async function init() {
  renderUser();
  const d = store.get('draft', null);
  SITE = normalize(d ? d : await loadPublished());
  route();
})();

</script>
</body>
</html>
